<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>RANDOM MUSEUM — Generative Art</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="art-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>

  <!-- Title overlay -->
  <div id="title-overlay" class="hidden">
    <h2 id="art-title"></h2>
    <div class="title-credits">— No. <span id="art-number">0000</span></div>
  </div>

  <!-- Bottom toolbar -->
  <div id="toolbar">
    <button id="prev-btn" class="tool-btn" title="Previous">←</button>
    <button id="regen-btn" class="tool-btn big" title="Regenerate">🎲</button>
    <button id="next-btn" class="tool-btn" title="Next">→</button>
    <button id="gallery-btn" class="tool-btn auto" title="Auto gallery mode">🖼️</button>
    <button id="save-btn" class="tool-btn save" title="Save as PNG">💾</button>
  </div>

  <!-- Style selector -->
  <div id="style-bar">
    <!-- populated by JS -->
  </div>

  <!-- Start overlay (first-time) -->
  <div id="start-overlay" class="screen">
    <h1 class="brand">RANDOM<br><span class="accent">MUSEUM</span></h1>
    <p class="slogan">Every tap = a unique masterpiece.<br>Generated by pure code. Never repeated.</p>
    <button id="start-btn" class="big-btn">ENTER</button>
    <div class="hint">Tap anywhere · Long-press = auto gallery 💾</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
