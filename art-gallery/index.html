<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MUSEUM STUDIO — Magic Brush</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="art-canvas"></canvas>

  <!-- Brush toolbar (left, vertical) -->
  <div id="brush-bar" class="panel">
    <div class="panel-title">BRUSH</div>
    <div id="brush-list"></div>
  </div>

  <!-- Color palette (top right) -->
  <div id="color-bar" class="panel">
    <div class="panel-title">PALETTE</div>
    <div id="color-list"></div>
  </div>

  <!-- Top-left: stroke size -->
  <div id="size-box" class="panel">
    <div class="panel-title">SIZE</div>
    <input type="range" id="size-slider" min="1" max="100" value="30">
  </div>

  <!-- Bottom toolbar -->
  <div id="toolbar">
    <button id="undo-btn" class="tool-btn" title="Undo">↶</button>
    <button id="clear-btn" class="tool-btn warn" title="Clear">🗑️</button>
    <button id="gallery-btn" class="tool-btn" title="Auto background">🎨</button>
    <button id="save-btn" class="tool-btn save" title="Save as PNG">💾</button>
  </div>

  <!-- Start overlay -->
  <div id="start-overlay" class="screen">
    <h1 class="brand">MUSEUM<br><span class="accent">STUDIO</span></h1>
    <p class="slogan">Your finger is the brush.<br>The canvas is infinite.<br>Draw. Savor. Save.</p>
    <button id="start-btn" class="big-btn">START PAINTING</button>
    <div class="hint">Drag to draw · Pick a brush · Save as PNG 💾</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
