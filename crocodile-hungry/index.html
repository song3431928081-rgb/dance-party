<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101418">
<meta name="description" content="Mr. Croc Is Hungry - feed the crocodile while its mouth is open. Miss three times and get chomped. A single-file HTML5 meme game.">
<title>Mr. Croc Is Hungry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101418'/%3E%3Cpath d='M8 35 Q32 16 56 35 Q56 52 32 56 Q8 52 8 35Z' fill='%234A7C3F'/%3E%3Ccircle cx='23' cy='35' r='4.5' fill='%23fff'/%3E%3Ccircle cx='41' cy='35' r='4.5' fill='%23fff'/%3E%3Ccircle cx='23' cy='35' r='2' fill='%23101814'/%3E%3Ccircle cx='41' cy='35' r='2' fill='%23101814'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #070a0c;
  }
  body {
    display: grid;
    place-items: center;
    overscroll-behavior: none;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Heiti SC", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    width: min(100vw, calc(100dvh * 9 / 16));
    width: min(100vw, calc(100svh * 9 / 16));
    height: min(100dvh, calc(100vw * 16 / 9));
    height: min(100svh, calc(100vw * 16 / 9));
    overflow: hidden;
    border-radius: 18px;
    background: #101418;
    box-shadow: 0 24px 90px rgba(0, 0, 0, .72), 0 0 0 1px rgba(196, 222, 184, .06);
    isolation: isolate;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    touch-action: none;
    cursor: pointer;
    background: #101418;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (max-width: 600px) {
    #stage {
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
<main id="stage">
  <canvas id="game" width="450" height="800" role="img" aria-label="Mr. Croc Is Hungry. Tap the screen or press Space to throw meat while the mouth is open."></canvas>
  <p class="sr-only" id="help">Tap the screen on mobile, or press Space or click the left mouse button on desktop, to throw meat. Five hits in a row triggers a three-second frenzy with double points. Three misses ends the game.</p>
</main>
<script>
(() => {
  'use strict';

  /* ---------------------------------- 基础工具 ---------------------------------- */
  const W = 450;
  const H = 800;
  const TAU = Math.PI * 2;
  const COOLDOWN = 0.2;
  const FLIGHT_TIME = 0.17;
  const ROUND_TIME = 30;
  const BEST_KEY = 'croc-hungry-best-v1';
  const MUTE_KEY = 'croc-hungry-muted-v1';
  const RUNS_KEY = 'croc-hungry-runs-v1';
  const CHILI_UNLOCK = 5;
  const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC","Heiti SC",system-ui,sans-serif';
  const TITLE = 'MR. CROC IS HUNGRY';
  const RANKS = [
    { min: 30, name: 'CROC LEGEND', color: '#FFD166' },
    { min: 20, name: 'GUT BUSTER', color: '#FFB86B' },
    { min: 13, name: 'CROC SLAYER', color: '#C9E39B' },
    { min: 7, name: 'MEAT DEALER', color: '#9FD08A' },
    { min: 3, name: 'INTERN FEEDER', color: '#8FB882' },
    { min: 0, name: 'FRESH MEAT', color: '#7D9B77' }
  ];
  // Local ghost leaderboard: offline score targets, zero network.
  const GHOST_BOARD = [
    { name: 'CROC GREED', score: 28 },
    { name: 'YOUR EX', score: 22 },
    { name: 'TIKTOK CHEF', score: 17 },
    { name: 'MEAT GREMLIN', score: 13 },
    { name: 'UNCLE BOB', score: 10 },
    { name: 'NPC #7', score: 7 },
    { name: 'SKILL ISSUE', score: 4 },
    { name: 'BEIGE FLAG', score: 2 }
  ];

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  function safeRead(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value === null || value === undefined ? fallback : value;
    } catch (err) {
      return fallback;
    }
  }
  function safeWrite(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (err) { /* 本地文件或隐私模式也可能禁用存储 */ }
  }
  function loadBest() {
    const n = parseInt(safeRead(BEST_KEY, '0'), 10);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  function loadRuns() {
    try {
      const raw = safeRead(RUNS_KEY, '[]');
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr
        .map((r) => Number(r && r.score))
        .filter((n) => Number.isFinite(n) && n >= 0)
        .sort((a, b) => b - a)
        .slice(0, 8);
    } catch (err) {
      return [];
    }
  }

  function recordRun(score) {
    const runs = loadRuns();
    runs.push(Math.max(0, score | 0));
    runs.sort((a, b) => b - a);
    safeWrite(RUNS_KEY, JSON.stringify(runs.slice(0, 8)));
  }

  function rankFor(score) {
    for (const r of RANKS) {
      if (score >= r.min) return r;
    }
    return RANKS[RANKS.length - 1];
  }

  function buildBoard(score) {
    const rows = GHOST_BOARD.map((g) => ({ name: g.name, score: g.score, you: false }));
    rows.push({ name: 'YOU', score: Math.max(0, Number(score) || 0), you: true });
    rows.sort((a, b) => b.score - a.score || (a.you ? -1 : 1));
    return rows;
  }

  function rankInBoard(board) {
    const i = board.findIndex((r) => r.you);
    return i < 0 ? board.length : i + 1;
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const stage = document.getElementById('stage');

  let viewW = W;
  let viewH = H;

  function fitCanvas() {
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 1 || rect.height < 1) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.25);
    const bw = Math.max(1, Math.round(rect.width * dpr));
    const bh = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    viewW = bw;
    viewH = bh;
  }

  /* ---------------------------------- 音频 ---------------------------------- */
  const Sound = {
    ctx: null,
    master: null,
    noiseBuffer: null,
    musicGain: null,
    musicTimer: null,
    musicPlaying: false,
    musicStep: 0,
    musicNext: 0,
    muted: safeRead(MUTE_KEY, '0') === '1',

    init() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        if (!this.musicPlaying) this.startMusic();
        return;
      }
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ac = new Ctx();
        const master = ac.createGain();
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.knee.value = 14;
        comp.ratio.value = 6;
        comp.attack.value = .003;
        comp.release.value = .22;
        master.gain.value = this.muted ? 0 : .62;
        master.connect(comp);
        comp.connect(ac.destination);
        this.ctx = ac;
        this.master = master;

        this.musicGain = ac.createGain();
        this.musicGain.gain.value = .0001;
        this.musicGain.gain.setTargetAtTime(.32, ac.currentTime, .55);
        this.musicGain.connect(master);

        const len = Math.floor(ac.sampleRate * 1.2);
        const buffer = ac.createBuffer(1, len, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        this.noiseBuffer = buffer;
        this.startMusic();
      } catch (err) {
        this.ctx = null;
        this.master = null;
      }
    },

    ready() {
      return !!(this.ctx && this.master && !this.muted);
    },

    setMuted(value) {
      this.muted = !!value;
      safeWrite(MUTE_KEY, this.muted ? '1' : '0');
      if (this.ctx && this.master) {
        const t = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(t);
        this.master.gain.setTargetAtTime(this.muted ? 0 : .62, t, .025);
      }
    },

    toggle() {
      this.init();
      this.setMuted(!this.muted);
      if (!this.muted) this.click(620, 860, .07, .09);
      return this.muted;
    },

    tone(opts) {
      if (!this.ready()) return;
      const ac = this.ctx;
      const o = ac.createOscillator();
      const g = ac.createGain();
      const delay = opts.delay || 0;
      const dur = opts.dur || .15;
      const vol = opts.vol === undefined ? .15 : opts.vol;
      const t = ac.currentTime + delay;
      o.type = opts.type || 'sine';
      o.frequency.setValueAtTime(Math.max(20, opts.from || 440), t);
      if (opts.to !== undefined) {
        o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t + dur);
      }
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), t + (opts.attack || .004));
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g);
      g.connect(this.master);
      o.start(t);
      o.stop(t + dur + .025);
    },

    noise(opts) {
      if (!this.ready() || !this.noiseBuffer) return;
      const ac = this.ctx;
      const delay = opts.delay || 0;
      const dur = opts.dur || .12;
      const vol = opts.vol === undefined ? .18 : opts.vol;
      const t = ac.currentTime + delay;
      const src = ac.createBufferSource();
      const filter = ac.createBiquadFilter();
      const g = ac.createGain();
      src.buffer = this.noiseBuffer;
      filter.type = opts.type || 'lowpass';
      filter.frequency.value = opts.freq || 1200;
      filter.Q.value = opts.q || .8;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), t + (opts.attack || .003));
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(this.master);
      src.start(t, Math.random() * .25, dur + .03);
      src.stop(t + dur + .04);
    },

    click(from, to, dur, vol) {
      this.tone({ type: 'square', from, to, dur, vol, attack: .002 });
    },

    playOpen(scale) {
      const k = scale === undefined ? 1 : scale;
      this.tone({ type: 'square', from: 190, to: 105, dur: .055, vol: .1 * k, attack: .002 });
      this.tone({ type: 'square', from: 92, to: 70, dur: .05, vol: .05 * k, attack: .002, delay: .012 });
    },

    playSnap() {
      this.tone({ type: 'square', from: 130, to: 55, dur: .045, vol: .075, attack: .002 });
    },

    playHit() {
      this.tone({ type: 'sine', from: 145, to: 52, dur: .18, vol: .28, attack: .004 });
      this.noise({ dur: .045, vol: .12, type: 'highpass', freq: 1350, q: 1.2, delay: .045 });
      this.noise({ dur: .04, vol: .1, type: 'highpass', freq: 1750, q: 1.4, delay: .085 });
      this.noise({ dur: .045, vol: .095, type: 'highpass', freq: 1200, q: 1.2, delay: .125 });
      this.tone({ type: 'sine', from: 78, to: 50, dur: .16, vol: .11, attack: .01, delay: .15 });
    },

    playMiss() {
      this.noise({ dur: .13, vol: .3, type: 'lowpass', freq: 1450, q: .7 });
      this.tone({ type: 'triangle', from: 170, to: 70, dur: .12, vol: .14, attack: .002 });
      this.tone({ type: 'square', from: 250, to: 120, dur: .035, vol: .045, attack: .002 });
    },

    playBite() {
      this.noise({ dur: .28, vol: .34, type: 'lowpass', freq: 720, q: .8 });
      this.tone({ type: 'sawtooth', from: 165, to: 38, dur: .5, vol: .28, attack: .005 });
      this.tone({ type: 'triangle', from: 740, to: 1540, dur: .24, vol: .12, attack: .008, delay: .02 });
      this.tone({ type: 'triangle', from: 1600, to: 460, dur: .38, vol: .085, attack: .01, delay: .24 });
      this.tone({ type: 'square', from: 96, to: 42, dur: .34, vol: .12, attack: .005, delay: .08 });
    },

    playFrenzy() {
      this.tone({ type: 'triangle', from: 250, to: 880, dur: .4, vol: .16, attack: .01 });
      this.tone({ type: 'triangle', from: 375, to: 1320, dur: .38, vol: .075, attack: .01 });
      this.tone({ type: 'sine', from: 185, to: 440, dur: .42, vol: .1, attack: .02 });
    },

    playChili() {
      this.noise({ dur: .16, vol: .18, type: 'highpass', freq: 2100, q: 1.1 });
      this.tone({ type: 'sawtooth', from: 420, to: 90, dur: .3, vol: .13, attack: .003 });
      this.tone({ type: 'square', from: 90, to: 46, dur: .24, vol: .09, attack: .004, delay: .06 });
      this.tone({ type: 'triangle', from: 620, to: 1450, dur: .18, vol: .05, attack: .006, delay: .08 });
    },

    playBurn() {
      this.noise({ dur: .26, vol: .26, type: 'lowpass', freq: 900, q: .6 });
      this.tone({ type: 'sawtooth', from: 190, to: 62, dur: .36, vol: .16, attack: .003 });
      this.tone({ type: 'square', from: 1300, to: 320, dur: .22, vol: .055, attack: .004, delay: .04 });
    },

    playGold() {
      this.tone({ type: 'triangle', from: 660, to: 990, dur: .13, vol: .12, attack: .004 });
      this.tone({ type: 'triangle', from: 990, to: 1320, dur: .14, vol: .09, attack: .004, delay: .07 });
      this.tone({ type: 'sine', from: 1320, to: 1760, dur: .18, vol: .07, attack: .004, delay: .14 });
    },

    playPhase() {
      this.tone({ type: 'triangle', from: 170, to: 260, dur: .32, vol: .12, attack: .02 });
      this.tone({ type: 'triangle', from: 340, to: 520, dur: .32, vol: .07, attack: .02, delay: .08 });
      this.tone({ type: 'square', from: 70, to: 55, dur: .18, vol: .05, attack: .004, delay: .16 });
    },

    playTimeUp() {
      this.tone({ type: 'square', from: 880, to: 880, dur: .11, vol: .11, attack: .003 });
      this.tone({ type: 'square', from: 660, to: 660, dur: .11, vol: .11, attack: .003, delay: .14 });
      this.tone({ type: 'square', from: 440, to: 330, dur: .28, vol: .12, attack: .003, delay: .28 });
    },

    /* 程序化搞笑 BGM：低音号 + 走调小号旋律 + 鼓 + 牛铃 */
    setMusicLevel(level) {
      if (!this.ctx || !this.musicGain) return;
      const t = this.ctx.currentTime;
      this.musicGain.gain.cancelScheduledValues(t);
      this.musicGain.gain.setTargetAtTime(level, t, .35);
    },

    startMusic() {
      if (!this.ctx || !this.musicGain || this.musicPlaying) return;
      this.musicPlaying = true;
      this.musicStep = 0;
      this.musicNext = this.ctx.currentTime + .14;
      this.scheduleMusic();
    },

    scheduleMusic() {
      if (!this.musicPlaying || !this.ctx) return;
      clearTimeout(this.musicTimer);
      const ac = this.ctx;
      if (this.musicNext < ac.currentTime - .08) this.musicNext = ac.currentTime + .06;
      while (this.musicNext < ac.currentTime + .35) {
        this.playMusicStep(this.musicStep, this.musicNext);
        this.musicStep = (this.musicStep + 1) % 64;
        this.musicNext += .24;
      }
      this.musicTimer = setTimeout(() => this.scheduleMusic(), 110);
    },

    musicVoice(type, from, to, t, dur, vol) {
      if (!this.ctx || !this.musicGain) return;
      const ac = this.ctx;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(Math.max(20, from), t);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g);
      g.connect(this.musicGain);
      o.start(t);
      o.stop(t + dur + .03);
    },

    musicLead(freq, t, dur, vol, slideTo) {
      if (!this.ctx || !this.musicGain) return;
      const ac = this.ctx;
      const o = ac.createOscillator();
      const g = ac.createGain();
      const lfo = ac.createOscillator();
      const lg = ac.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      lfo.type = 'sine';
      lfo.frequency.value = 6.2;
      lg.gain.value = 4.5;
      lfo.connect(lg);
      lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002, vol), t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g);
      g.connect(this.musicGain);
      lfo.start(t);
      o.start(t);
      lfo.stop(t + dur + .03);
      o.stop(t + dur + .03);
    },

    musicKick(t) {
      if (!this.ctx || !this.musicGain) return;
      const ac = this.ctx;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(132, t);
      o.frequency.exponentialRampToValueAtTime(42, t + .13);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.17, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + .15);
      o.connect(g);
      g.connect(this.musicGain);
      o.start(t);
      o.stop(t + .18);
    },

    musicSnare(t) {
      if (!this.ctx || !this.musicGain || !this.noiseBuffer) return;
      const ac = this.ctx;
      const src = ac.createBufferSource();
      const f = ac.createBiquadFilter();
      const g = ac.createGain();
      src.buffer = this.noiseBuffer;
      f.type = 'highpass';
      f.frequency.value = 1500;
      g.gain.setValueAtTime(.05, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .1);
      src.connect(f);
      f.connect(g);
      g.connect(this.musicGain);
      src.start(t, Math.random() * .3, .11);
      src.stop(t + .12);
    },

    musicHat(t) {
      if (!this.ctx || !this.musicGain || !this.noiseBuffer) return;
      const ac = this.ctx;
      const src = ac.createBufferSource();
      const f = ac.createBiquadFilter();
      const g = ac.createGain();
      src.buffer = this.noiseBuffer;
      f.type = 'highpass';
      f.frequency.value = 6800;
      g.gain.setValueAtTime(.022, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .035);
      src.connect(f);
      f.connect(g);
      g.connect(this.musicGain);
      src.start(t, Math.random() * .5, .04);
      src.stop(t + .045);
    },

    playMusicStep(step, t) {
      const intense = typeof G !== 'undefined' && G.frenzyActive;
      const section = Math.floor(step / 32) % 2;
      const s = step % 32;
      const bass = [65.41, 65.41, 98, 65.41, 55, 55, 82.41, 55, 43.65, 43.65, 65.41, 43.65, 49, 49, 61.74, 49];
      const leadA = [523.25, 659.25, 783.99, 659.25, 523.25, 587.33, 659.25, 0, 440, 523.25, 659.25, 523.25, 440, 493.88, 523.25, 0, 349.23, 440, 523.25, 440, 349.23, 392, 440, 0, 392, 493.88, 587.33, 493.88, 392, 440, 493.88, 523.25];
      const leadB = [392, 493.88, 587.33, 493.88, 392, 440, 493.88, 0, 349.23, 440, 523.25, 440, 349.23, 392, 440, 0, 329.63, 392, 493.88, 392, 329.63, 349.23, 392, 0, 349.23, 440, 523.25, 440, 349.23, 392, 440, 523.25];
      const lead = section ? leadB : leadA;
      if (s % 2 === 0) {
        const f = bass[(s / 2) % 16];
        this.musicVoice('triangle', f, f * .995, t, .34, .09);
        if (section) this.musicVoice('square', f * 2, f * 2 * .997, t, .18, .018);
      }
      const lf = lead[s];
      if (lf) {
        const tail = s === 31;
        this.musicLead(lf, t, tail ? .32 : .16, .042, tail ? 1046.5 : 0);
        if (intense) this.musicLead(lf * 2, t, .12, .013, 0);
      }
      if (s % 8 === 0 || s === 14 || s === 30) this.musicKick(t);
      if (s % 8 === 4) this.musicSnare(t);
      if (s % 2 === 0) this.musicHat(t);
      if (intense && s % 2 === 1) this.musicHat(t);
      if (s % 8 === 6) this.musicVoice('square', section ? 660 : 720, section ? 500 : 540, t, .09, .028);
      if (s === 23) this.musicLead(section ? 174.61 : 196, t, .18, .03, section ? 349.23 : 392);
    }
  };

  /* ---------------------------------- 游戏状态 ---------------------------------- */
  const G = {
    state: 'ready',
    paused: false,
    elapsed: 0,
    score: 0,
    best: loadBest(),
    bestAtStart: 0,
    lives: 3,
    combo: 0,
    maxCombo: 0,
    lastThrow: -99,
    frenzyActive: false,
    frenzyTime: 0,

  G.board = buildBoard(G.best);

  const croc = {

  const pointer = { x: 225, y: 400, active: false, down: false };

  const MUTE_RECT = { x: 380, y: 18, w: 56, h: 54 };

  const FOOD_RECTS = {
    meat: { x: 18, y: 74, w: 80, h: 50 },

  };
  const QUIPS = [
    'Croc: burp.',

    'Chew faster next time.',
    "That's it? That's all the meat?",
    'Croc: acceptable. Barely.',
    'That burp registered on the Richter scale.',

    'Croc is still hungry. Obviously.',
    'Your hand is faster than its jaw. Allegedly.',

  ];
  const MEME_HIT = ['SLAY', 'ATE', 'W CROC', 'NO CAP', 'RIZZ', 'SHEESH', 'GOATED', 'NOM NOM'];
  const MEME_MISS = ['BRUH', 'SKILL ISSUE', 'MID', 'COPE', 'L + RATIO', 'YIKES', 'OOF', 'BONK'];
  const MEME_GOLD = ['RIZZ', 'W', 'GOATED', 'SHEESH'];
  const MEME_CHILI = ['SUS', 'SPICY', 'HOT TAKE', 'GAS'];

  // 每日词条：同一台设备一天内固定，给每局一个不同的起手规则
  const DAILY_MODS = [
    { id: 'gold', name: 'GOLD RUSH', desc: 'gold drops twice as often', goldFast: true, scoreMult: 1, orderBonus: 2 },
    { id: 'spicy', name: 'SPICY NIGHT', desc: 'spicy unlocked · chili +1', spicy: true, chiliBonus: 1, scoreMult: 1, orderBonus: 2 },
    { id: 'rush', name: 'RUSH HOUR', desc: 'faster jaw · +25% points', mouth: .84, scoreMult: 1.25, orderBonus: 2 },
    { id: 'big', name: 'BIG ORDERS', desc: 'orders pay +4 · less time', orderBonus: 4, orderTime: .78, scoreMult: 1 }
  ];

  function todayMod() {
    const d = new Date();
    const n = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    return DAILY_MODS[(n * 17 + 3) % DAILY_MODS.length];
  }

  const TODAY_MOD = todayMod();
  let lastQuipIndex = -1;

  /* ---------------------------------- 输入坐标 ---------------------------------- */
  function toLogical(event) {
    const r = canvas.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return { x: W / 2, y: H / 2 };
    return {
      x: (event.clientX - r.left) * (W / r.width),
      y: (event.clientY - r.top) * (H / r.height)
    };
  }

  function inRect(p, r) {
    return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
  }

  function handlePress(p) {
    Sound.init();
    if (!p) p = { x: 225, y: 400 };

    if (inRect(p, MUTE_RECT)) {
      Sound.toggle();
      G.mutedFlash = .55;
      return;
    }

    if (G.paused) {
      G.paused = false;
      lastFrame = performance.now();
      Sound.init();
      return;
    }

    if (G.state === 'ready') {
      startGame();
      return;
    }

    if (G.state === 'playing') {
      if (G.goldPickup && Math.hypot(p.x - G.goldPickup.x, p.y - G.goldPickup.y) < 42) {
        collectGold();
        return;
      }
      for (const kind of ['meat', 'chili']) {
        if (inRect(p, FOOD_RECTS[kind])) {
          selectFood(kind);
          return;
        }
      }
      if (G.elapsed - G.lastThrow >= COOLDOWN) throwMeat(p.x, p.y);
      return;
    }

    if (G.state === 'over') {
      if ((p.viaKey && G.overReveal > .35) || (G.overReveal > .78 && inRect(p, RESTART_RECT))) restartGame();
    }
  }

  canvas.addEventListener('pointerdown', (event) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    if (!event.isPrimary) return;
    event.preventDefault();
    const p = toLogical(event);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.active = true;
    pointer.down = true;
    handlePress(p);
  }, { passive: false });

  canvas.addEventListener('pointermove', (event) => {
    if (event.pointerType === 'touch') return;
    const p = toLogical(event);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.active = true;
  }, { passive: true });

  canvas.addEventListener('pointerup', () => { pointer.down = false; });
  canvas.addEventListener('pointercancel', () => { pointer.down = false; });
  canvas.addEventListener('pointerleave', (event) => {
    if (event.pointerType !== 'touch') pointer.active = false;
  });
  canvas.addEventListener('contextmenu', (event) => event.preventDefault());

  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
      event.preventDefault();
      if (event.repeat) return;
      Sound.init();
      handlePress({ x: 225, y: 390, viaKey: true });
      return;
    }
    if (event.code === 'KeyM') {
      event.preventDefault();
      Sound.init();
      Sound.toggle();
      G.mutedFlash = .55;
      return;
    }
    if (G.state === 'playing' && (event.code === 'Digit1' || event.code === 'Digit2')) {
      event.preventDefault();
      selectFood(event.code === 'Digit1' ? 'meat' : 'chili');
    }
  });

  /* ---------------------------------- 流程 ---------------------------------- */
  function resetCroc() {
    croc.bounceY = 0;
    croc.bounceV = 0;
    croc.lookX = 0;
    croc.lookY = .1;
    croc.blink = 0;
    croc.blinkTimer = rand(2.2, 4.2);
    croc.happy = 0;
    croc.annoyed = 0;
    croc.chew = 0;
    croc.fire = 0;
    croc.burnt = 0;
    croc.shock = 0;
    croc.dizzy = 0;
    croc.love = 0;
    croc.smug = 0;
    croc.wink = 0;
  }

  function startGame() {
    G.state = 'playing';
    G.paused = false;
    G.elapsed = 0;
    G.score = 0;
    G.bestAtStart = G.best;
    G.lives = 3;
    G.combo = 0;
    G.maxCombo = 0;
    G.lastThrow = -99;
    G.frenzyActive = false;
    G.frenzyTime = 0;
    G.overReveal = 0;
    G.biteTime = 0;
    G.newRecord = false;
    G.quip = '';
    G.tutorial = 3.2;
    G.redFlash = 0;
    G.shakeTime = 0;
    G.shakePower = 0;
    G.scorePop = 0;
    G.heartPulse = 0;
    G.mutedFlash = 0;
    G.food = 'meat';
    G.mod = TODAY_MOD;
    G.chiliUnlocked = G.best >= CHILI_UNLOCK || !!G.mod.spicy;
    G.goldShots = 0;
    G.goldTimer = G.mod.goldFast ? 6 : 10;
    G.goldPickup = null;
    G.order = null;
    G.orderTimer = 7;
    G.boss = null;
    G.bossNext = 12;
    G.bossCount = 0;
    G.timeUp = false;
    G.zoomPulse = 0;
    G.phase = 0;
    G.phaseBanner = 0;
    G.phaseText = '';
    G.phaseSub = '';
    G.warmFlash = 0;
    G.comboFlash = 0;
    G.board = buildBoard(0);
    G.rank = rankInBoard(G.board);
    G.rankTitle = rankFor(0).name;

    meats.length = 0;
    particles.length = 0;
    floaters.length = 0;
    rings.length = 0;

    resetCroc();

    mouth.mode = 'open';
    mouth.fake = false;
    mouth.timer = 1.08;
    mouth.gape = .32;
    mouth.target = 1;
    mouth.doubleNext = false;
    addFloater('LET HIM COOK', 225, 286, '#F4C96B', 27, 1.1, -24);

    Sound.setMusicLevel(.32);
    Sound.playOpen(1);
    lastFrame = performance.now();
  }

  function restartGame() {
    Sound.init();
    startGame();
  }

  function enterGameOver(timeUp) {
    if (G.state !== 'playing') return;
    G.timeUp = !!timeUp;
    G.state = 'over';
    G.paused = false;
    Sound.setMusicLevel(.12);
    if (!G.timeUp) G.lives = 0;
    G.combo = 0;
    G.frenzyActive = false;
    G.frenzyTime = 0;
    G.overReveal = 0;
    G.biteTime = G.timeUp ? 0 : .62;
    if (G.score > G.best) {
      G.best = G.score;
      safeWrite(BEST_KEY, G.best);
    }
    G.newRecord = G.score > G.bestAtStart;
    G.lastThrow = -99;
    G.phaseBanner = 0;
    G.goldPickup = null;
    G.order = null;
    G.boss = null;
    if (G.score > 0) recordRun(G.score);
    G.board = buildBoard(G.score);
    G.rank = rankInBoard(G.board);
    G.rankTitle = rankFor(G.score).name;

    let idx = (Math.random() * QUIPS.length) | 0;
    if (idx === lastQuipIndex) idx = (idx + 1) % QUIPS.length;
    lastQuipIndex = idx;
    G.quip = QUIPS[idx];

    mouth.mode = 'closed';
    mouth.fake = false;
    mouth.target = G.timeUp ? 0 : .96;
    mouth.doubleNext = false;
    G.shakeTime = G.timeUp ? .2 : .44;
    G.shakeDuration = G.timeUp ? .2 : .44;
    G.shakePower = G.timeUp ? 6 : 19;
    G.redFlash = G.timeUp ? 0 : 1;

    if (G.timeUp) {
      Sound.playTimeUp();
      addRings(225, 560, 2, '#F4C96B');
      addFloater('TIME!', 225, 460, '#F4C96B', 30, 1.1, -45);
    } else {
      Sound.playBite();
      spawnBiteBurst(225, 626);
      addRings(225, 615, 3, '#FF6B72');
      addFloater('CHOMP!', 225, 460, '#FFB4A8', 30, 1.1, -45);

      for (let i = 0; i < 18; i++) {
        particles.push({
          kind: 'glow',
          x: 225 + rand(-80, 80),
          y: 610 + rand(-70, 70),
          vx: rand(-180, 180),
          vy: rand(-260, -50),
          gravity: 120,
          life: rand(.35, .9),
          maxLife: .9,
          size: rand(2, 7),
          color: i % 2 ? '#FF5A62' : '#FFB199',
          rot: rand(0, TAU),
          spin: rand(-5, 5)
        });
      }
    }
    meats.length = 0;
  }

  /* ---------------------------------- 嘴部节奏 ---------------------------------- */
  function difficultyP() {
    return clamp((G.elapsed - 2) / 26, 0, 1);
  }

  function openDuration() {
    const p = difficultyP();
    let d = lerp(.70, .21, p) * rand(.92, 1.06);
    if (G.phase >= 3) d *= .94;
    if (G.frenzyActive) d *= 1.7;
    if (G.mod && G.mod.mouth) d *= G.mod.mouth;
    return clamp(d, .18, 1.25);
  }

  function closedDuration() {
    const p = difficultyP();
    let d = lerp(.92, .30, p) * rand(.84, 1.14);
    if (G.phase >= 3) d *= .92;
    if (G.mod && G.mod.mouth) d *= .92;
    return clamp(d, .25, 1.1);
  }

  function fakeChance() {
    if (G.elapsed < 8) return 0;
    let c = .26;
    if (G.phase >= 2) c += .06;
    if (G.phase >= 3) c += .08;
    return Math.min(.42, c);
  }

  function doubleChance() {
    if (G.elapsed < 22) return 0;
    return G.phase >= 3 ? .44 : .32;
  }

  function updateGold(dt) {
    if (G.goldPickup) {
      G.goldPickup.life -= dt;
      if (G.goldPickup.life <= 0) {
        G.goldPickup = null;
        G.goldTimer = G.mod && G.mod.goldFast ? rand(8, 12) : rand(15, 21);
        addFloater('GOLD MEAT GOT AWAY...', 225, 334, 'rgba(255, 209, 102, .8)', 12, .8, -20);
      }
      return;
    }
    G.goldTimer -= dt;
    if (G.goldTimer <= 0 && G.elapsed > 9 && !G.order) spawnGold();
  }

  function phaseIndex(t) {
    if (t >= 26) return 3;
    if (t >= 22) return 2;
    if (t >= 8) return 1;
    return 0;
  }

  function enterPhase(n) {
    if (n <= G.phase) return;
    G.phase = n;
    const data = n === 1
      ? ['PHASE 2 · FAKE-OUT', 'it fakes you out. rude.']
      : n === 2
        ? ['PHASE 3 · DOUBLE CHOMP', 'faster rhythm. no mercy.']
        : ['FINAL PHASE · HANGRY', 'tiny window. big teeth.'];
    G.phaseText = data[0];
    G.phaseSub = data[1];
    G.phaseBanner = 2.6;
    G.comboFlash = 1;
    if (n === 1 && !G.chiliUnlocked) {
      G.chiliUnlocked = true;
      addFloater('SPICY UNLOCKED! TOP-LEFT', 225, 380, '#FF9A7A', 15, 1.2, -28);
    }
    Sound.playPhase();
  }

  function openMouth(duration, fake) {
    mouth.mode = 'open';
    mouth.fake = !!fake;
    mouth.openAge = 0;
    mouth.timer = duration;
    mouth.target = fake ? .44 : 1;
    if (fake) mouth.gape = Math.min(mouth.gape, .35);
    Sound.playOpen(fake ? .55 : 1);
  }

  function closeMouth(duration) {
    mouth.mode = 'closed';
    mouth.fake = false;
    mouth.timer = duration;
    mouth.target = 0;
    mouth.openAge = 0;
  }

  function advanceMouth() {
    if (mouth.mode === 'open') {
      if (mouth.fake) {
        closeMouth(rand(.22, .36));
        Sound.playSnap();
        return;
      }
      if (G.elapsed >= 22 && !G.frenzyActive && !mouth.doubleNext && Math.random() < doubleChance()) {
        closeMouth(.13);
        mouth.doubleNext = true;
        Sound.playSnap();
        return;
      }
      closeMouth(closedDuration());
      return;
    }

    if (mouth.doubleNext) {
      mouth.doubleNext = false;
      openMouth(openDuration() * .82, false);
      return;
    }

    if (G.elapsed >= 8 && !G.frenzyActive && Math.random() < fakeChance()) {
      openMouth(rand(.16, G.phase >= 3 ? .20 : .22), true);
      return;
    }

    openMouth(openDuration(), false);
  }

  function updateMouth(dt) {
    if (G.state !== 'playing') return;
    if (mouth.mode === 'open') mouth.openAge += dt;
    mouth.timer -= dt;
    if (mouth.timer <= 0) advanceMouth();
    const speed = mouth.target > mouth.gape ? 34 : 23;
    mouth.gape += (mouth.target - mouth.gape) * (1 - Math.exp(-speed * dt));
    mouth.gape = clamp(mouth.gape, 0, 1);
  }

  function mouthIsOpen() {
    return mouth.mode === 'open' && !mouth.fake && mouth.gape >= .52;
  }

  /* ---------------------------------- 食材 / 金肉空投 ---------------------------------- */
  function selectFood(kind) {
    if (G.state !== 'playing' || G.paused) return;
    if (kind === 'chili' && !G.chiliUnlocked) {
      addFloater('HIT ' + CHILI_UNLOCK + ' TO UNLOCK SPICY', 225, 354, '#F4C96B', 14, 1.0, -30);
      Sound.playSnap();
      return;
    }
    if (G.food === kind) return;
    G.food = kind;
    addFloater(kind === 'chili' ? 'SPICY LOADED · +2 / MISS -2' : 'BACK TO MEAT · PLAY IT SAFE', 225, 354, kind === 'chili' ? '#FF9A7A' : '#F9A8D4', 13, 1.0, -28);
    Sound.click(kind === 'chili' ? 520 : 420, kind === 'chili' ? 760 : 620, .06, .075);
  }

  function spawnGold() {
    if (G.state !== 'playing' || G.goldPickup) return;
    G.goldPickup = {
      x: rand(92, 358),
      y: rand(262, 356),
      life: 4.6,
      maxLife: 4.6,
      rot: rand(0, TAU)
    };
    addFloater('GOLD DROP · TAP IT', G.goldPickup.x, G.goldPickup.y - 34, '#FFD166', 13.5, 1.3, -24);
    Sound.tone({ type: 'triangle', from: 780, to: 1180, dur: .16, vol: .07, attack: .006 });
  }

  function collectGold() {
    if (G.state !== 'playing' || !G.goldPickup) return;
    const g = G.goldPickup;
    G.goldShots = Math.min(2, G.goldShots + 1);
    G.goldPickup = null;
    G.goldTimer = G.mod && G.mod.goldFast ? rand(9, 13) : rand(17, 23);
    G.comboFlash = .7;
    croc.shock = .38;
    croc.happy = .55;
    addFloater('GOLD LOADED ×' + G.goldShots, 225, 382, '#FFD166', 17, 1.0, -32);
    addRings(g.x, g.y, 3, '#FFD166');
    for (let i = 0; i < 20; i++) {
      particles.push({
        kind: 'glow',
        x: g.x + rand(-8, 8),
        y: g.y + rand(-8, 8),
        vx: rand(-150, 150),
        vy: rand(-170, 30),
        gravity: 90,
        life: rand(.35, .8),
        maxLife: .8,
        size: rand(1.8, 5),
        color: i % 3 ? '#FFD166' : '#FFF3C4',
        rot: rand(0, TAU),
        spin: rand(-6, 6)
      });
    }
    Sound.playGold();
  }

  function spawnOrder() {
    if (G.state !== 'playing' || G.order || G.frenzyActive || G.boss) return;
    const chance = G.mod && G.mod.spicy ? .62 : .45;
    const kind = G.chiliUnlocked && Math.random() < chance ? 'chili' : 'meat';
    let duration = clamp(4.6 - G.elapsed * .024, 2.5, 4.6);
    if (G.mod && G.mod.orderTime) duration *= G.mod.orderTime;
    G.order = {
      kind, timer: duration, duration,
      age: 0,
      flipPending: G.elapsed >= 22 && Math.random() < .28,
      flipped: false
    };
    G.orderTimer = 999;
    Sound.tone({ type: 'square', from: 330, to: 520, dur: .09, vol: .045, attack: .004 });
  }

  function updateOrders(dt) {
    if (G.state !== 'playing' || G.paused) return;
    if (G.frenzyActive || G.boss) return;
    if (!G.order) {
      G.orderTimer -= dt;
      if (G.elapsed > 4.2 && G.orderTimer <= 0 && !G.goldPickup) spawnOrder();
      return;
    }
    const o = G.order;
    o.age += dt;
    o.timer -= dt;
    if (o.flipPending && !o.flipped && o.age >= 1.15) {
      o.kind = o.kind === 'meat' ? 'chili' : 'meat';
      o.flipped = true;
      o.flipPending = false;
      o.timer = Math.max(o.timer, 2.35);
      o.duration = o.timer;
      croc.smug = .6;
      addFloater('SIKE!', 225, 270, '#FFD166', 28, .9, -30);
      addFloater('ORDER CHANGED', 225, 240, '#FF8A80', 11.5, 1.0, -18);
      Sound.tone({ type: 'square', from: 440, to: 620, dur: .07, vol: .045, attack: .003 });
      Sound.tone({ type: 'square', from: 660, to: 330, dur: .08, vol: .04, attack: .003, delay: .07 });
    }
    if (o.timer <= 0) {
      G.order = null;
      G.orderTimer = rand(6, 9);
      croc.annoyed = 1.15;
      addFloater('ORDER EXPIRED...', 225, 330, '#A8B9A1', 13, 1.0, -22);
      Sound.tone({ type: 'sawtooth', from: 210, to: 145, dur: .12, vol: .04 });
    }
  }

  function orderMatches(kind) {
    if (!G.order) return false;
    return kind === G.order.kind || (G.order.kind === 'meat' && kind === 'gold');
  }

  /* ---------------------------------- 卫生检查员 ---------------------------------- */
  function startBoss() {
    if (G.state !== 'playing' || G.boss || G.frenzyActive) return;
    G.boss = { timer: 10, duration: 10, need: 5, hits: 0, flash: 0 };
    G.order = null;
    G.orderTimer = 6;
    G.goldPickup = null;
    croc.annoyed = 1.1;
    G.zoomPulse = .035;
    Sound.setMusicLevel(.2);
    Sound.tone({ type: 'sawtooth', from: 190, to: 110, dur: .32, vol: .06, attack: .006 });
    addFloater('HEALTH INSPECTOR', 225, 318, '#FF8A80', 24, 1.25, -24);
    addFloater('FEED 5 TIMES. NO EXCUSES.', 225, 286, '#FFD166', 12, 1.3, -18);
  }

  function updateBoss(dt) {
    if (G.state !== 'playing' || G.paused) return;
    if (!G.boss) {
      if (G.bossCount < 1 && !G.frenzyActive && G.phaseBanner <= 0 && G.elapsed >= G.bossNext) startBoss();
      return;
    }
    G.boss.flash = Math.max(0, G.boss.flash - dt);
    G.boss.timer -= dt;
    if (G.boss.timer <= 0) failBoss();
  }

  function passBoss() {
    if (!G.boss) return;
    G.boss = null;
    G.bossCount += 1;
    G.bossNext = 999;
    G.score += 5;
    if (G.score > G.best) {
      G.best = G.score;
      safeWrite(BEST_KEY, G.best);
    }
    G.board = buildBoard(G.score);
    G.rank = rankInBoard(G.board);
    G.rankTitle = rankFor(G.score).name;
    G.lives = Math.min(3, G.lives + 1);
    G.heartPulse = 1;
    G.zoomPulse = .055;
    G.warmFlash = .4;
    croc.smug = 1.4;
    croc.love = .85;
    addFloater('PASSED! +5 · +1 HEART', 225, 318, '#A7F3D0', 19, 1.5, -30);
    addRings(225, 560, 4, '#A7F3D0');
    Sound.setMusicLevel(.32);
    Sound.tone({ type: 'triangle', from: 520, to: 1040, dur: .22, vol: .07, attack: .004 });
  }

  function failBoss() {
    if (!G.boss) return;
    G.boss = null;
    G.bossCount += 1;
    G.bossNext = 999;
    G.lives = Math.max(0, G.lives - 1);
    G.combo = 0;
    G.frenzyActive = false;
    G.frenzyTime = 0;
    G.heartPulse = 1;
    croc.annoyed = 1.6;
    croc.dizzy = 1.2;
    G.shakeTime = .32;
    G.shakeDuration = .32;
    G.shakePower = 9;
    addFloater('INSPECTION FAILED -1 HEART', 225, 318, '#FF8A80', 18, 1.4, -30);

    if (G.lives <= 0) enterGameOver();
    else Sound.setMusicLevel(.32);
  }

  /* ---------------------------------- 投喂 ---------------------------------- */
  function throwMeat(px, py) {
    if (G.state !== 'playing' || G.paused) return;
    if (G.elapsed - G.lastThrow < COOLDOWN) return;
    G.lastThrow = G.elapsed;

    const sx = clamp(px, 36, 414);
    const sy = 792;
    const tx = 225 + rand(-5, 5);
    const ty = 602;
    const cx = clamp((sx + tx) / 2 + rand(-52, 52), 30, 420);
    const cy = Math.min(sy, ty) - rand(96, 142);
    let kind = G.food === 'chili' ? 'chili' : 'meat';
    if (G.goldShots > 0) {
      kind = 'gold';
      G.goldShots -= 1;
      addRings(sx, sy - 22, 2, '#FFD166');
    }

    meats.push({
      sx, sy, cx, cy, tx, ty,
      kind,
      x: sx, y: sy,
      t: 0,
      duration: FLIGHT_TIME,
      rot: rand(0, TAU),
      spin: rand(-10, 10),
      trail: []
    });

    croc.lookX = clamp((px - 225) / 180, -1, 1);
    croc.lookY = clamp((py - 500) / 200, -1, 1);

    for (let i = 0; i < 3; i++) {
      particles.push({
        kind: 'chunk',
        x: sx + rand(-8, 8),
        y: 770 + rand(-10, 10),
        vx: rand(-30, 30),
        vy: rand(-100, -30),
        gravity: 450,
        life: rand(.18, .35),
        maxLife: .35,
        size: rand(2, 4),
        color: i ? '#F472B6' : '#FBCFE8',
        rot: rand(0, TAU),
        spin: rand(-8, 8)
      });
    }
  }

  function updateMeats(dt) {
    for (let i = meats.length - 1; i >= 0; i--) {
      const m = meats[i];
      m.t += dt / m.duration;
      if (m.t >= 1) {
        resolveMeat(m);
        meats.splice(i, 1);
        if (G.state !== 'playing') {
          meats.length = 0;
          break;
        }
        continue;
      }
      const t = m.t;
      const it = 1 - t;
      m.x = it * it * m.sx + 2 * it * t * m.cx + t * t * m.tx;
      m.y = it * it * m.sy + 2 * it * t * m.cy + t * t * m.ty;
      m.rot += m.spin * dt;
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > 5) m.trail.shift();
    }
  }

  function resolveMeat(m) {
    if (G.state !== 'playing') return;

    if (mouthIsOpen()) {
      const kind = m.kind || 'meat';
      const base = kind === 'gold' ? 3 : kind === 'chili' ? 2 : 1;
      const perfect = !mouth.fake && mouth.openAge <= .50;
      const orderHit = orderMatches(kind);
      const orderValue = orderHit ? ((G.mod && G.mod.orderBonus) || 2) : 0;
      const chiliBonus = kind === 'chili' && G.mod && G.mod.chiliBonus ? G.mod.chiliBonus : 0;
      let gain = Math.round((base + (perfect ? 1 : 0) + orderValue + chiliBonus) * ((G.mod && G.mod.scoreMult) || 1));
      if (G.frenzyActive) gain *= 2;
      G.score += gain;
      if (G.score > G.best) {
        G.best = G.score;
        safeWrite(BEST_KEY, G.best);
      }
      G.board = buildBoard(G.score);
      G.rank = rankInBoard(G.board);
      G.rankTitle = rankFor(G.score).name;
      if (!G.chiliUnlocked && G.score >= CHILI_UNLOCK) {
        G.chiliUnlocked = true;
        addFloater('SPICY UNLOCKED! TOP-LEFT', 225, 376, '#FF9A7A', 15, 1.2, -28);
      }
      G.combo += 1;
      G.maxCombo = Math.max(G.maxCombo, G.combo);
      G.scorePop = Math.min(1.5, G.scorePop + 1);
      croc.happy = kind === 'chili' ? .35 : .78;
      croc.chew = .62;
      croc.annoyed = 0;
      croc.smug = 0;
      croc.bounceV = -170;

      if (G.frenzyActive) {
        mouth.mode = 'open';
        mouth.fake = false;
        mouth.target = 1;
        mouth.gape = Math.max(mouth.gape, .96);
        mouth.timer = Math.max(mouth.timer, G.frenzyTime + .12);
        mouth.openAge = 0;
        mouth.doubleNext = false;
      } else {
        mouth.mode = 'closed';
        mouth.fake = false;
        mouth.target = 0;
        mouth.timer = kind === 'chili' ? .72 : Math.max(.52, closedDuration() * .8);
        mouth.doubleNext = false;
        mouth.gape = Math.min(mouth.gape, .9);
      }

      if (kind === 'gold') {
        spawnGoldBits(m.x, m.y);
        addRings(m.x, m.y, 4, '#FFD166');
        addFloater('+' + gain + ' GOLD!', 225 + rand(-12, 12), m.y - 20, '#FFD166', G.frenzyActive ? 34 : 30, .9, -62);
        if (Math.random() < .55) addFloater(pick(MEME_GOLD), 225, 322, '#FFD166', 30, .72, -44);
        croc.shock = .35;
        croc.love = .75;
        Sound.playGold();
      } else if (kind === 'chili') {
        spawnFireBits(m.x, m.y);
        addRings(m.x, m.y, 3, '#FF7A4A');
        addFloater('+' + gain + ' SPICY!', 225 + rand(-12, 12), m.y - 18, '#FF9A6A', G.frenzyActive ? 32 : 28, .85, -60);
        if (Math.random() < .55) addFloater(pick(MEME_CHILI), 225, 322, '#FF9A6A', 30, .72, -44);
        croc.fire = 1.15;
        croc.shock = .28;
        croc.burnt = 0;
        G.warmFlash = .8;
        Sound.playChili();
      } else {
        spawnMeatBits(m.x, m.y);
        addRings(m.x, m.y, 2, '#F9A8D4');
        addFloater('+' + gain, 225 + rand(-18, 18), m.y - 16, G.frenzyActive ? '#FFD166' : '#F9A8D4', G.frenzyActive ? 31 : 27, .72, -62);
        if (Math.random() < .24) addFloater('BURP~', 278, 548, '#D9F99D', 15, .8, -42);
        if (Math.random() < .3) addFloater(pick(MEME_HIT), 225, 318, '#F9A8D4', 32, .7, -48);
        Sound.playHit();
      }

      if (perfect) addFloater('CLUTCH +1', 300, 350, '#A7F3D0', 15, .7, -38);
      G.comboFlash = Math.max(G.comboFlash, .35);
      G.zoomPulse = kind === 'gold' ? .055 : .032 + Math.min(.025, G.combo * .0025);

      if (orderHit) {
        G.order = null;
        G.orderTimer = rand(6, 9);
        croc.smug = 1.15;
        croc.love = .7;
        addFloater('ORDER UP! +' + orderValue, 225, 330, '#A7F3D0', 21, 1.0, -42);
        addRings(225, 560, 3, '#A7F3D0');
        Sound.tone({ type: 'triangle', from: 660, to: 990, dur: .16, vol: .06, attack: .005 });
      } else if (G.order) {
        croc.annoyed = 1.05;
        if (Math.random() < .65) addFloater('WRONG ORDER...', 225, 312, '#FCA5A5', 13, .9, -22);
      }

      if (G.boss && G.boss.hits < G.boss.need) {
        G.boss.hits += 1;
        G.boss.flash = .35;
        addFloater('INSPECTOR ' + G.boss.hits + '/' + G.boss.need, 225, 288, '#F4C96B', 13, .7, -24);
        Sound.tone({ type: 'square', from: 540 + G.boss.hits * 55, to: 700 + G.boss.hits * 55, dur: .07, vol: .04, attack: .003 });
        if (G.boss.hits >= G.boss.need) passBoss();
      }

      if (G.combo > 0 && G.combo % 5 === 0 && !G.frenzyActive) startFrenzy();
      return;
    }

    missFeed(m);
  }

  function missFeed(m) {
    const kind = m.kind || 'meat';
    const damage = kind === 'chili' ? 2 : 1;
    G.lives = Math.max(0, G.lives - damage);
    G.combo = 0;
    G.frenzyActive = false;

      G.shakeTime = .2;
      G.shakeDuration = .2;

      Sound.playMiss();

    G.heartPulse = 1;
    G.scorePop = 0;

    if (G.lives <= 0) {
      enterGameOver();

  function startFrenzy() {
    const refreshed = G.frenzyActive;

    G.frenzyTime = 3;
    Sound.setMusicLevel(.4);
    G.scorePop = 1.3;
    // 狂暴期间嘴直接卡在最大张开，让玩家可以真正“疯狂投喂”
    mouth.mode = 'open';
    mouth.fake = false;
    mouth.target = 1;
    mouth.gape = Math.max(mouth.gape, .92);
    mouth.timer = Math.max(mouth.timer, 3.15);
    mouth.openAge = 0;
    Sound.playFrenzy();
    addFloater(refreshed ? 'STILL FERAL!' : 'GIGACHAD MODE ×2', 225, 352, '#FF8A80', refreshed ? 24 : 28, 1.05, -36);
    addFloater('DEAL WITH IT', 225, 312, '#F9A8D4', 18, 1.0, -36);
    addRings(225, 590, 3, '#FF5A62');
    for (let i = 0; i < 24; i++) {

  function addRings(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      rings.push({
        x, y,
        r: 12 + i * 13,
        speed: 150 + i * 55,
        life: .38 + i * .06,
        maxLife: .38 + i * .06,
        color
      });
