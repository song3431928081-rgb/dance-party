  }

  function addFloater(text, x, y, color, size, life, vy) {
    floaters.push({
      text, x, y, color,
      size: size || 24,
      life: life || .8,
      maxLife: life || .8,
      vy: vy === undefined ? -58 : vy,
      wobble: rand(0, TAU)
    });
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.gravity * dt;
      p.vx *= Math.max(0, 1 - 1.3 * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      if (f.life <= 0) { floaters.splice(i, 1); continue; }
      f.y += f.vy * dt;
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.life -= dt;
      if (r.life <= 0) { rings.splice(i, 1); continue; }
      r.r += r.speed * dt;
    }
  }

  /* ---------------------------------- 更新 ---------------------------------- */
  function updateCroc(dt) {
    let tx = 0;
    let ty = .08;
    if (G.state === 'playing' && meats.length) {
      const m = meats[meats.length - 1];
      tx = clamp((m.x - 225) / 150, -1, 1);
      ty = clamp((m.y - 480) / 190, -1, 1);
    } else if (pointer.active && G.state !== 'over') {
      tx = clamp((pointer.x - 225) / 180, -1, 1);
      ty = clamp((pointer.y - 470) / 200, -1, 1);
    } else {
      tx = Math.sin(clock * .55) * .35;
      ty = Math.cos(clock * .42) * .14;
    }
    croc.lookX += (tx - croc.lookX) * (1 - Math.exp(-6.5 * dt));
    croc.lookY += (ty - croc.lookY) * (1 - Math.exp(-6.5 * dt));

    if (G.state !== 'over' && croc.happy <= 0 && !G.frenzyActive) {
      croc.blinkTimer -= dt;
      if (croc.blinkTimer <= 0) {
        croc.blink = .13;
        croc.blinkTimer = rand(2.2, 5.2);
      }
      croc.blink = Math.max(0, croc.blink - dt);
    }

    croc.happy = Math.max(0, croc.happy - dt);
    croc.annoyed = Math.max(0, croc.annoyed - dt);
    croc.chew = Math.max(0, croc.chew - dt);
    croc.fire = Math.max(0, croc.fire - dt);
    croc.burnt = Math.max(0, croc.burnt - dt);
    croc.shock = Math.max(0, croc.shock - dt);
    croc.dizzy = Math.max(0, croc.dizzy - dt);
    croc.love = Math.max(0, croc.love - dt);
    croc.smug = Math.max(0, croc.smug - dt);

    croc.bounceV += (-croc.bounceY * 250 - croc.bounceV * 16) * dt;
    croc.bounceY += croc.bounceV * dt;
    if (Math.abs(croc.bounceY) < .012) {
      croc.bounceY = 0;
      croc.bounceV *= .7;
    }
  }

  function updateCommon(dt) {
    G.scorePop = Math.max(0, G.scorePop - dt * 3.4);
    G.heartPulse = Math.max(0, G.heartPulse - dt * 3.2);
    G.mutedFlash = Math.max(0, G.mutedFlash - dt * 2.5);
    G.redFlash = Math.max(0, G.redFlash - dt * 1.9);
    G.tutorial = Math.max(0, G.tutorial - dt);
    G.shakeTime = Math.max(0, G.shakeTime - dt);
    if (G.shakeTime <= 0) G.shakePower = 0;
    G.warmFlash = Math.max(0, G.warmFlash - dt * 1.9);
    G.comboFlash = Math.max(0, G.comboFlash - dt * 2.4);
    G.phaseBanner = Math.max(0, G.phaseBanner - dt);
    G.zoomPulse *= Math.exp(-9 * dt);
    if (G.zoomPulse < .001) G.zoomPulse = 0;
  }

  function update(dt) {
    clock += dt;

    if (G.state === 'ready') {
      const pulse = Math.pow(Math.max(0, Math.sin(clock * .86 - .55)), 13);
      const target = pulse * .88;
      mouth.gape += (target - mouth.gape) * (1 - Math.exp(-8 * dt));
      mouth.gape = clamp(mouth.gape, 0, 1);
      updateCroc(dt);
      updateParticles(dt);
    } else if (G.state === 'playing') {
      G.elapsed += dt;
      if (G.elapsed >= ROUND_TIME) {
        G.elapsed = ROUND_TIME;
        enterGameOver(true);
        return;
      }
      if (phaseIndex(G.elapsed) > G.phase) enterPhase(phaseIndex(G.elapsed));

      if (G.frenzyActive) {
        G.frenzyTime -= dt;
        if (G.frenzyTime <= 0) {
          G.frenzyActive = false;
          G.frenzyTime = 0;
          Sound.setMusicLevel(.32);
          if (mouth.mode === 'open') {
            // 给最后一秒扔出的肉留一点判定余量
            mouth.timer = Math.max(mouth.timer, .24);
            mouth.target = 1;
          }
        }
      }

      updateMouth(dt);
      updateMeats(dt);
      updateGold(dt);
      updateBoss(dt);
      updateOrders(dt);
      updateCroc(dt);
      updateParticles(dt);
    } else if (G.state === 'over') {
      G.overReveal += dt;
      G.biteTime = Math.max(0, G.biteTime - dt);
      const target = G.biteTime > 0 ? .95 : .08;
      mouth.gape += (target - mouth.gape) * (1 - Math.exp(-11 * dt));
      mouth.gape = clamp(mouth.gape, 0, 1);
      updateCroc(dt);
      updateParticles(dt);
    }

    updateCommon(dt);
  }

  /* ---------------------------------- 绘制基础 ---------------------------------- */
  function setFont(size, weight, family) {
    ctx.font = (weight || 700) + ' ' + size + 'px ' + (family || FONT);
  }

  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawHeart(x, y, s, filled) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * .78);
    ctx.bezierCurveTo(x - s * 1.46, y - s * .12, x - s * .68, y - s * 1.18, x, y - s * .43);
    ctx.bezierCurveTo(x + s * .68, y - s * 1.18, x + s * 1.46, y - s * .12, x, y + s * .78);
    if (filled) {
      ctx.fillStyle = '#FB7185';
      ctx.fill();
      ctx.strokeStyle = '#FF9DB0';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.015)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,158,143,.42)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
  }

  function drawStarShape(x, y, r, inner, points, rotation) {
    const n = points || 4;
    const ir = r * (inner === undefined ? .36 : inner);
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const rad = i % 2 ? ir : r;
      const a = (rotation || 0) - Math.PI / 2 + i * Math.PI / n;
      const px = x + Math.cos(a) * rad;
      const py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  /* ---------------------------------- 背景 ---------------------------------- */
  const dust = Array.from({ length: 28 }, () => ({
    x: rand(16, W - 16),
    y: rand(105, 700),
    r: rand(.55, 1.7),
    a: rand(.025, .08),
    phase: rand(0, TAU),
    speed: rand(.25, .7)
  }));

  function drawBackground() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#161f23');
    bg.addColorStop(.48, '#10161a');
    bg.addColorStop(1, '#0a0f11');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(225, 575, 30, 225, 575, 360);
    glow.addColorStop(0, 'rgba(89, 132, 76, .16)');
    glow.addColorStop(.52, 'rgba(67, 104, 60, .055)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 150, W, 650);

    for (const d of dust) {
      const a = d.a * (.55 + .45 * Math.sin(clock * d.speed + d.phase));
      ctx.fillStyle = 'rgba(195, 219, 190,' + Math.max(0, a).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(d.x + Math.sin(clock * .22 + d.phase) * 5, d.y + Math.cos(clock * .18 + d.phase) * 7, d.r, 0, TAU);
      ctx.fill();
    }

    // 底部脏绿色地面
    const floor = ctx.createLinearGradient(0, 718, 0, H);
    floor.addColorStop(0, '#1d2b1b');
    floor.addColorStop(.34, '#162117');
    floor.addColorStop(1, '#0b100d');
    ctx.fillStyle = floor;
    ctx.fillRect(0, 718, W, H - 718);

    ctx.beginPath();
    ctx.moveTo(0, 728);
    ctx.bezierCurveTo(70, 714, 126, 734, 194, 724);
    ctx.bezierCurveTo(266, 714, 330, 732, 398, 721);
    ctx.bezierCurveTo(424, 717, 440, 722, 450, 719);
    ctx.lineTo(450, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    const floorTop = ctx.createLinearGradient(0, 718, 0, 760);
    floorTop.addColorStop(0, '#2b4127');
    floorTop.addColorStop(1, '#182316');
    ctx.fillStyle = floorTop;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, 728);
    ctx.bezierCurveTo(70, 714, 126, 734, 194, 724);
    ctx.bezierCurveTo(266, 714, 330, 732, 398, 721);
    ctx.bezierCurveTo(424, 717, 440, 722, 450, 719);
    ctx.strokeStyle = '#3d5b32';
    ctx.lineWidth = 2.3;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(109, 143, 80, .18)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 11; i++) {
      const y = 742 + i * 5.2;
      const x = 20 + (i * 71) % 390;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 18 + (i % 4) * 9, y + 1);
      ctx.stroke();
    }

    // 边缘草叶剪影
    ctx.strokeStyle = 'rgba(37, 55, 31, .75)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    const grass = [
      [14, 742, 4, 692, -10, 668], [25, 746, 22, 704, 34, 684],
      [436, 742, 446, 696, 434, 672], [424, 748, 411, 710, 405, 690],
      [52, 757, 42, 732, 38, 724], [398, 758, 407, 731, 416, 722]
    ];
    for (const g of grass) {
      ctx.beginPath();
      ctx.moveTo(g[0], g[1]);
      ctx.quadraticCurveTo(g[2], g[3], g[4], g[5]);
      ctx.stroke();
    }
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(225, 390, 190, 225, 410, 480);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.5)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------------------------------- 绘制鳄鱼 ---------------------------------- */
  function headPath() {
    ctx.beginPath();
    ctx.moveTo(84, 600);
    ctx.bezierCurveTo(74, 544, 92, 474, 138, 447);
    ctx.bezierCurveTo(157, 424, 180, 416, 200, 421);
    ctx.bezierCurveTo(210, 407, 240, 407, 250, 421);
    ctx.bezierCurveTo(272, 415, 296, 426, 313, 447);
    ctx.bezierCurveTo(358, 474, 376, 544, 366, 600);
    ctx.bezierCurveTo(378, 646, 366, 706, 330, 729);
    ctx.bezierCurveTo(300, 750, 150, 750, 120, 729);
    ctx.bezierCurveTo(84, 706, 72, 646, 84, 600);
    ctx.closePath();
  }

  function getMouthGeom() {
    const g = clamp(mouth.gape, 0, 1);
    const chewJitter = croc.chew > 0 ? Math.sin(clock * 47) * 3.2 * (croc.chew / .58) : 0;
    return {
      g,
      left: 225 - (112 + 8 * g),
      right: 225 + (112 + 8 * g),
      top: 592 - 18 * g,
      bottom: 601 + 105 * g + chewJitter
    };
  }

  function mouthPath(gm) {
    const { left, right, top, bottom, g } = gm;
    ctx.beginPath();
    ctx.moveTo(left, top + 2);
    ctx.bezierCurveTo(left + 28, top - 7 * g, right - 28, top - 7 * g, right, top + 2);
    ctx.bezierCurveTo(right - 4, bottom + 5, right - 52, bottom + 10 * g + 4, 225, bottom + 10 * g);
    ctx.bezierCurveTo(left + 52, bottom + 10 * g + 4, left + 4, bottom + 5, left, top + 2);
    ctx.closePath();
  }

  function drawSnout(gm) {
    // 突出的长吻：鳄鱼正面也有宽而扁的吻部，鼻尖就是吻端
    const g = gm.g;

    // 吻部后方的浅色鳞斑
    ctx.fillStyle = 'rgba(142, 184, 115, .22)';
    for (const side of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(225 + side * (100 + i * 5), 500 + i * 34, 8, 4.2, side * .4, 0, TAU);
        ctx.fill();
      }
    }
    const top = 518 + 3 * g;
    const sides = [[140, 588], [310, 588]];
    ctx.beginPath();
    ctx.moveTo(sides[0][0], sides[0][1]);
    ctx.bezierCurveTo(126, 558, 136, 533, 164, 522);
    ctx.quadraticCurveTo(225, 507 + 3 * g, 286, 522);
    ctx.bezierCurveTo(314, 533, 324, 558, sides[1][0], sides[1][1]);
    ctx.quadraticCurveTo(225, 603, sides[0][0], sides[0][1]);
    ctx.closePath();
    const snout = ctx.createLinearGradient(0, top, 0, 596);
    snout.addColorStop(0, '#5c934b');
    snout.addColorStop(.62, '#548a45');
    snout.addColorStop(1, '#467638');
    ctx.fillStyle = snout;
    ctx.fill();
    ctx.strokeStyle = 'rgba(35, 63, 28, .42)';
    ctx.lineWidth = 2.4;
    ctx.stroke();

    // 鼻梁高光
    ctx.strokeStyle = 'rgba(150, 196, 123, .5)';
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(225, 516 + 3 * g);
    ctx.quadraticCurveTo(219, 531, 224, 542);
    ctx.stroke();

    // 吻部两侧的鳞片
    ctx.fillStyle = 'rgba(34, 61, 27, .25)';
    for (const side of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(225 + side * (55 + i * 10), 548 + i * 12, 8 - i, 4.2 - i * .3, side * .35, 0, TAU);
        ctx.fill();
      }
    }

    // 吻端鼻孔（鳄鱼的鼻孔靠前，像两道小竖缝）
    for (const side of [-1, 1]) {
      const nx = 225 + side * 23;
      const ny = 556 + 2 * g;
      ctx.fillStyle = '#5f984e';
      ctx.strokeStyle = 'rgba(35, 62, 27, .75)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(nx, ny + 2.5, 15, 8.5, side * .12, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(25, 44, 19, .5)';
      ctx.beginPath();
      ctx.ellipse(nx, ny + 1.8, 12, 6.6, side * .12, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#203a1b';
      ctx.beginPath();
      ctx.ellipse(nx, ny, 7.2, 3.4, side * .25, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(157, 199, 128, .55)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(nx, ny - 5, 7, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    }
  }

  function drawMouth() {
    const gm = getMouthGeom();
    const g = gm.g;

    if (g < .065) {
      // 闭嘴：单层嘴缝 + 两颗獠牙，不再画整排牙
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(gm.left + 2, gm.top + 1);
      ctx.quadraticCurveTo(225, gm.top + 15, gm.right - 2, gm.top + 1);
      ctx.strokeStyle = '#1e3119';
      ctx.lineWidth = 9;
      ctx.stroke();
      ctx.strokeStyle = '#6a9c55';
      ctx.lineWidth = 2.4;
      ctx.stroke();

      for (const side of [-1, 1]) {
        const fx = 225 + side * 72;
        ctx.beginPath();
        ctx.moveTo(fx - 5, gm.top + 6);
        ctx.lineTo(fx + 5, gm.top + 6);
        ctx.lineTo(fx + side * .8, gm.top + 21);
        ctx.closePath();
        ctx.fillStyle = '#F4ECD6';
        ctx.fill();
        ctx.strokeStyle = 'rgba(93, 70, 31, .4)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(53, 85, 43, .55)';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(gm.left + 14, gm.top + 9);
      ctx.quadraticCurveTo(225, gm.top + 26, gm.right - 14, gm.top + 9);
      ctx.stroke();

      const chinTop = gm.bottom - 1;
      ctx.beginPath();
      ctx.moveTo(gm.left - 6, chinTop + 3);
      ctx.quadraticCurveTo(225, chinTop + 23, gm.right + 6, chinTop + 3);
      ctx.quadraticCurveTo(gm.right + 3, chinTop + 40, 225, chinTop + 53);
      ctx.quadraticCurveTo(gm.left - 3, chinTop + 40, gm.left - 6, chinTop + 3);
      ctx.closePath();
      const chin = ctx.createLinearGradient(0, chinTop, 0, chinTop + 55);
      chin.addColorStop(0, '#4C7F3F');
      chin.addColorStop(1, '#34572b');
      ctx.fillStyle = chin;
      ctx.fill();
      ctx.strokeStyle = '#223a1d';
      ctx.lineWidth = 4.4;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(gm.left + 1, chinTop + 5);
      ctx.quadraticCurveTo(225, chinTop + 25, gm.right - 1, chinTop + 5);
      ctx.strokeStyle = '#72a65d';
      ctx.lineWidth = 2.4;
      ctx.stroke();

      ctx.fillStyle = 'rgba(36, 58, 28, .28)';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(190 + i * 34, chinTop + 33 + (i % 2) * 5, 3.5, 2.1, -.2, 0, TAU);
        ctx.fill();
      }

      ctx.strokeStyle = 'rgba(32, 52, 25, .7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gm.left - 4, gm.top + 7);
      ctx.quadraticCurveTo(gm.left - 22, gm.top + 13, gm.left - 27, gm.top + 24);
      ctx.moveTo(gm.right + 4, gm.top + 7);
      ctx.quadraticCurveTo(gm.right + 22, gm.top + 13, gm.right + 27, gm.top + 24);
      ctx.stroke();
      return;
    }

    ctx.save();
    mouthPath(gm);
    const inner = ctx.createLinearGradient(0, gm.top, 0, gm.bottom);
    inner.addColorStop(0, '#32070d');
    inner.addColorStop(.45, '#66111d');
    inner.addColorStop(1, '#8b1e2b');
    ctx.fillStyle = inner;
    ctx.fill();
    ctx.strokeStyle = '#260a0e';
    ctx.lineWidth = 3.6;
    ctx.stroke();
    ctx.clip();

    const throat = ctx.createRadialGradient(225, gm.top + (gm.bottom - gm.top) * .24, 2, 225, gm.top + (gm.bottom - gm.top) * .24, 72);
    throat.addColorStop(0, 'rgba(9,2,4,.92)');
    throat.addColorStop(1, 'rgba(9,2,4,0)');
    ctx.fillStyle = throat;
    ctx.fillRect(gm.left, gm.top - 5, gm.right - gm.left, gm.bottom - gm.top + 20);

    if (g > .12) {
      ctx.fillStyle = '#A63C4C';
      ctx.beginPath();
      ctx.ellipse(225, gm.bottom - 3 + 5 * g, 68 + 20 * g, 18 + 12 * g, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(231, 119, 134, .42)';
      ctx.beginPath();
      ctx.ellipse(225, gm.bottom - 7 + 3 * g, 37 + 12 * g, 7 + 4 * g, 0, 0, TAU);
      ctx.fill();
    }

    // 上排牙（闭嘴时不画，避免变成拉链）
    const upperCount = 7;
    for (let i = 1; i <= (g > .1 ? upperCount : 0); i++) {
      const t = i / (upperCount + 1);
      const x = lerp(gm.left + 10, gm.right - 10, t);
      const edge = gm.top + 2 - 7 * g * Math.sin(Math.PI * t);
      const len = (9 + ((i * 7) % 11)) * g;
      ctx.beginPath();
      ctx.moveTo(x - 5.7, edge + 1);
      ctx.lineTo(x + 5.7, edge + 1);
      ctx.lineTo(x + (i % 2 ? 1.2 : -1.2), edge + len);
      ctx.closePath();
      ctx.fillStyle = '#F8F2DE';
      ctx.fill();
      ctx.strokeStyle = 'rgba(97, 73, 34, .28)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 下排牙
    const lowerCount = 5;
    for (let i = 1; i <= (g > .1 ? lowerCount : 0); i++) {
      const t = i / (lowerCount + 1);
      const x = lerp(gm.left + 18, gm.right - 18, t);
      const edge = gm.bottom + 8 * g * Math.sin(Math.PI * t);
      const len = (7 + ((i * 5) % 8)) * g;
      ctx.beginPath();
      ctx.moveTo(x - 4.6, edge - 1);
      ctx.lineTo(x + 4.6, edge - 1);
      ctx.lineTo(x, edge - len);
      ctx.closePath();
      ctx.fillStyle = '#EEE7D0';
      ctx.fill();
      ctx.strokeStyle = 'rgba(97, 73, 34, .26)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();

    // 上嘴唇
    ctx.beginPath();
    ctx.moveTo(gm.left, gm.top + 3);
    ctx.bezierCurveTo(gm.left + 28, gm.top - 7 * g, gm.right - 28, gm.top - 7 * g, gm.right, gm.top + 3);
    ctx.strokeStyle = '#22381d';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.strokeStyle = '#679a55';
    ctx.lineWidth = 3.2;
    ctx.stroke();

    // 下颚与下巴
    const chinTop = gm.bottom - 1;
    ctx.beginPath();
    ctx.moveTo(gm.left - 6, chinTop + 3);
    ctx.quadraticCurveTo(225, chinTop + 23, gm.right + 6, chinTop + 3);
    ctx.quadraticCurveTo(gm.right + 3, chinTop + 40, 225, chinTop + 53);
    ctx.quadraticCurveTo(gm.left - 3, chinTop + 40, gm.left - 6, chinTop + 3);
    ctx.closePath();
    const chin = ctx.createLinearGradient(0, chinTop, 0, chinTop + 55);
    chin.addColorStop(0, '#4C7F3F');
    chin.addColorStop(1, '#34572b');
    ctx.fillStyle = chin;
    ctx.fill();
    ctx.strokeStyle = '#223a1d';
    ctx.lineWidth = 4.4;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(gm.left + 1, chinTop + 5);
    ctx.quadraticCurveTo(225, chinTop + 25, gm.right - 1, chinTop + 5);
    ctx.strokeStyle = '#72a65d';
    ctx.lineWidth = 2.4;
    ctx.stroke();

    // 下巴小斑点
    ctx.fillStyle = 'rgba(36, 58, 28, .28)';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(190 + i * 34, chinTop + 33 + (i % 2) * 5, 3.5, 2.1, -.2, 0, TAU);
      ctx.fill();
    }

    // 嘴角皱纹
    ctx.strokeStyle = 'rgba(32, 52, 25, .7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(gm.left - 4, gm.top + 7);
    ctx.quadraticCurveTo(gm.left - 22, gm.top + 13, gm.left - 27, gm.top + 24);
    ctx.moveTo(gm.right + 4, gm.top + 7);
    ctx.quadraticCurveTo(gm.right + 22, gm.top + 13, gm.right + 27, gm.top + 24);
    ctx.stroke();
  }

  function drawFireBreath() {
    if (croc.fire <= 0) return;
    const a = clamp(croc.fire / 1.15, 0, 1);
    const flick = Math.sin(clock * 34) * 7 + Math.sin(clock * 19) * 4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * .9;
    const g = ctx.createLinearGradient(225, 600, 225, 470);
    g.addColorStop(0, 'rgba(255, 220, 96, .95)');
    g.addColorStop(.38, 'rgba(255, 112, 24, .9)');
    g.addColorStop(1, 'rgba(255, 48, 16, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(194, 596);
    ctx.quadraticCurveTo(188 + flick, 548, 211 + flick, 500);
    ctx.quadraticCurveTo(225, 470 - flick, 239 - flick, 500);
    ctx.quadraticCurveTo(262 - flick, 548, 256, 596);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = a * .55;
    const inner = ctx.createLinearGradient(225, 596, 225, 520);
    inner.addColorStop(0, 'rgba(255, 255, 220, .9)');
    inner.addColorStop(1, 'rgba(255, 168, 40, 0)');
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.moveTo(207, 596);
    ctx.quadraticCurveTo(213, 548, 225, 522);
    ctx.quadraticCurveTo(237, 548, 243, 596);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = a * .45;
    ctx.fillStyle = 'rgba(90, 82, 70, .55)';
    for (let i = 0; i < 3; i++) {
      const sx = 205 + i * 20 + Math.sin(clock * 5 + i) * 7;
      const sy = 492 - i * 12 - (1 - a) * 20;
      ctx.beginPath();
      ctx.arc(sx, sy, 8 + i * 2.4, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSoot() {
    if (croc.burnt <= 0) return;
    const a = clamp(croc.burnt / 2.2, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * .5;
    ctx.fillStyle = '#20241f';
    for (const s of [[176, 556, 18, 11, -.3], [272, 548, 15, 9, .4], [225, 520, 24, 12, 0]]) {
      ctx.beginPath();
      ctx.ellipse(s[0], s[1], s[2], s[3], s[4], 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = a * .45;
    ctx.strokeStyle = 'rgba(200, 200, 186, .7)';
    ctx.lineWidth = 2.2;
    for (let i = 0; i < 4; i++) {
      const x = 170 + i * 36 + Math.sin(clock * 3 + i) * 6;
      const y = 435 - i * 5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 7, y - 13, x + 1, y - 25);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawEye(cx, cy, side, mood) {
    // 眼包
    ctx.beginPath();
    ctx.ellipse(cx, cy - 1, 36, 32, side * .035, 0, TAU);
    const bulge = ctx.createLinearGradient(0, cy - 38, 0, cy + 34);
    bulge.addColorStop(0, '#598f49');
    bulge.addColorStop(1, '#416e36');
    ctx.fillStyle = bulge;
    ctx.fill();
    ctx.strokeStyle = '#233b1d';
    ctx.lineWidth = 4;
    ctx.stroke();

    if (mood === 'dizzy') {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, 21, 23, side * .03, 0, TAU);
      ctx.fillStyle = '#F2DE9A';
      ctx.fill();
      ctx.strokeStyle = '#1d2d18';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.clip();
      ctx.strokeStyle = '#3b2a16';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 4.6; a += .16) {
        const r = 1.2 + a * 1.35;
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = 'rgba(44, 70, 36, .8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy + 2, 21, Math.PI * .16, Math.PI * .84);
      ctx.stroke();
      return;
    }

    if (mood === 'happy' || mood === 'sleepy' || mood === 'blink') {
      ctx.strokeStyle = '#243b1e';
      ctx.lineWidth = mood === 'happy' ? 5.2 : 4.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy + 5, 15, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
      // 小睫毛 / 眼纹
      ctx.strokeStyle = 'rgba(88, 135, 70, .9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy + 11, 20, Math.PI * 1.2, Math.PI * 1.8);
      ctx.stroke();
      return;
    }

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, 21, 23, side * .03, 0, TAU);
    ctx.fillStyle = '#F2DE9A';
    ctx.fill();
    ctx.strokeStyle = '#1d2d18';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.clip();

    let lx = croc.lookX * 7;
    let ly = croc.lookY * 5;
    if (mood === 'annoyed') { lx = -3.5; ly = -9; }
    if (mood === 'smug') { lx = -side * 3.5; ly = -7; }
    if (mood === 'shock') { lx = 0; ly = -2; }
    if (mood === 'frenzy' || mood === 'angry' || mood === 'fire') { lx *= .25; ly = 0; }

    if (mood === 'shock') {
      ctx.fillStyle = '#C98A33';
      ctx.beginPath();
      ctx.arc(cx + lx, cy + ly, 6.2, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(93, 53, 14, .7)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.fillStyle = '#140E08';
      ctx.beginPath();
      ctx.arc(cx + lx, cy + ly + .6, 2.5, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath();
      ctx.arc(cx + lx - 2.2, cy + ly - 2.4, 1.6, 0, TAU);
      ctx.fill();
    } else if (mood === 'love') {
      ctx.save();
      ctx.translate(cx + lx, cy + ly);
      ctx.scale(.85, .85);
      ctx.fillStyle = '#FF6F91';
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.bezierCurveTo(-15, -3, -8, -14, 0, -7);
      ctx.bezierCurveTo(8, -14, 15, -3, 0, 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath();
      ctx.arc(-4, -3, 2, 0, TAU);
      ctx.fill();
      ctx.restore();
    } else if (mood === 'frenzy' || mood === 'angry' || mood === 'fire') {
      ctx.save();
      const fireMood = mood === 'fire';
      ctx.shadowColor = fireMood ? 'rgba(255, 120, 40, .95)' : mood === 'frenzy' ? 'rgba(255, 79, 72, .95)' : 'rgba(255, 64, 64, .65)';
      ctx.shadowBlur = 22;
      ctx.fillStyle = fireMood ? '#FF8A2F' : mood === 'frenzy' ? '#FFC857' : '#E8574E';
      ctx.beginPath();
      ctx.arc(cx + lx, cy + ly, 11.5, 0, TAU);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#170707';
      ctx.beginPath();
      ctx.ellipse(cx + lx, cy + ly, 3.1, 9.6, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath();
      ctx.arc(cx + lx - 2.5, cy + ly - 4, 2, 0, TAU);
      ctx.fill();
    } else {
      // 金色虹膜 + 竖瞳，鳄鱼的辨识度主要靠这里
      ctx.fillStyle = '#C98A33';
      ctx.beginPath();
      ctx.arc(cx + lx, cy + ly, 11.2, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(93, 53, 14, .75)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.fillStyle = '#140E08';
      ctx.beginPath();
      ctx.ellipse(cx + lx, cy + ly + .4, 4.4, 11.4, side * .04, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath();
      ctx.arc(cx + lx - 3.4, cy + ly - 4.2, 2.7, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.beginPath();
      ctx.arc(cx + lx + 3.1, cy + ly + 4.4, 1.2, 0, TAU);
      ctx.fill();
    }

    if (mood === 'annoyed') {
      ctx.fillStyle = 'rgba(52, 83, 43, .9)';
      ctx.beginPath();
      ctx.ellipse(cx - side * 1, cy - 26, 28, 14, side * .1, 0, TAU);
      ctx.fill();
    }
    if (mood === 'smug') {
      ctx.fillStyle = '#4A7C3F';
      ctx.beginPath();
      ctx.ellipse(cx, cy - 21, 23, 12, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#233b1d';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(cx - 20, cy - 8);
      ctx.quadraticCurveTo(cx, cy - 3, cx + 20, cy - 9);
      ctx.stroke();
    }
    ctx.restore();

    // 下眼睑
    ctx.strokeStyle = 'rgba(44, 70, 36, .8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy + 2, 21, Math.PI * .16, Math.PI * .84);
    ctx.stroke();
  }

  function drawBrows(mood) {
    const angry = mood === 'angry' || mood === 'frenzy' || mood === 'annoyed' || mood === 'fire' || mood === 'dizzy';
    const happy = mood === 'happy' || mood === 'love';
    const sleepy = mood === 'sleepy';
    const shock = mood === 'shock';
    const smug = mood === 'smug';
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = angry ? '#253d1e' : '#2a4423';
    ctx.lineWidth = mood === 'frenzy' ? 10 : 9;

    const leftOuter = { x: 142, y: shock ? 432 : smug ? 438 : angry ? 443 : 441 };
    const leftInner = { x: 202, y: shock ? 423 : smug ? 430 : angry ? 452 : happy ? 430 : sleepy ? 444 : 436 };
    const rightOuter = { x: 308, y: shock ? 432 : smug ? 430 : angry ? 443 : 441 };
    const rightInner = { x: 248, y: shock ? 423 : smug ? 442 : angry ? 452 : happy ? 430 : sleepy ? 444 : 436 };
    const controlY = shock ? 414 : smug ? 426 : angry ? 451 : happy ? 425 : 431;

    if (mood === 'frenzy') {
      ctx.shadowColor = 'rgba(255, 72, 65, .6)';
      ctx.shadowBlur = 12;
    }

    ctx.beginPath();
    ctx.moveTo(leftOuter.x, leftOuter.y);
    ctx.quadraticCurveTo((leftOuter.x + leftInner.x) / 2, controlY, leftInner.x, leftInner.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(rightOuter.x, rightOuter.y);
    ctx.quadraticCurveTo((rightOuter.x + rightInner.x) / 2, controlY, rightInner.x, rightInner.y);
    ctx.stroke();
    ctx.restore();

    if (mood === 'annoyed' || mood === 'angry') {
      // 打结的小眉毛
      ctx.strokeStyle = '#21371c';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(220, 455);
      ctx.lineTo(230, 461);
      ctx.moveTo(230, 455);
      ctx.lineTo(220, 461);
      ctx.stroke();
    }

    if (happy) {
      ctx.strokeStyle = 'rgba(133, 183, 109, .55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(150, 431);
      ctx.quadraticCurveTo(173, 424, 194, 427);
      ctx.moveTo(300, 431);
      ctx.quadraticCurveTo(277, 424, 256, 427);
      ctx.stroke();
    }
  }

  function drawCroc() {
    const bob = Math.sin(clock * 1.45) * 2.2;
    const breathe = 1 + Math.sin(clock * 1.45) * .006;
    const mood = G.state === 'ready'
      ? (mouth.gape > .22 ? 'sleepy' : (croc.blink > 0 ? 'blink' : 'idle'))
      : G.state === 'over'
        ? 'angry'
        : G.frenzyActive
          ? 'frenzy'
          : croc.fire > 0
            ? 'fire'
            : croc.shock > 0
              ? 'shock'
              : croc.dizzy > 0
                ? 'dizzy'
                : croc.love > 0
                  ? 'love'
                  : croc.happy > 0
                    ? 'happy'
                    : croc.smug > 0
                      ? 'smug'
                      : croc.annoyed > 0
                        ? 'annoyed'
                        : croc.blink > 0
                          ? 'blink'
                          : 'idle';

    // 地面阴影
    ctx.save();
    ctx.globalAlpha = .55;
    const shadow = ctx.createRadialGradient(225, 750, 20, 225, 750, 190);
    shadow.addColorStop(0, 'rgba(0,0,0,.56)');
    shadow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.ellipse(225, 752, 190, 48, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    if (G.frenzyActive) {
      const aura = ctx.createRadialGradient(225, 580, 30, 225, 580, 330);
      const a = .15 + .075 * (0.5 + 0.5 * Math.sin(clock * 10));
      aura.addColorStop(0, 'rgba(255, 58, 62,' + a + ')');
      aura.addColorStop(.55, 'rgba(255, 38, 48,' + (a * .38) + ')');
      aura.addColorStop(1, 'rgba(255, 38, 48,0)');
      ctx.fillStyle = aura;
      ctx.fillRect(0, 270, W, 520);
    }

    ctx.save();
    ctx.translate(0, bob + croc.bounceY);
    ctx.scale(1 / breathe, breathe);

    // 身体
    const body = ctx.createLinearGradient(0, 670, 0, 800);
    body.addColorStop(0, '#3c6330');
    body.addColorStop(1, '#294521');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(225, 755, 178, 116, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#1e3319';
    ctx.lineWidth = 4.5;
    ctx.stroke();

    // 肚皮纹
    ctx.strokeStyle = 'rgba(111, 157, 85, .35)';
    ctx.lineWidth = 2.2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(225, 728 + i * 22, 108 - i * 18, .16 * Math.PI, .84 * Math.PI);
      ctx.stroke();
    }

    // 小短手
    for (const side of [-1, 1]) {
      const ax = 225 + side * 152;
      ctx.save();
      ctx.translate(ax, 696);
      ctx.rotate(side * -.16);
      ctx.fillStyle = '#3d6934';
      ctx.beginPath();
      ctx.ellipse(0, 0, 19, 35, side * .12, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#1f351b';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.strokeStyle = '#719e5e';
      ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 7, 26);
        ctx.lineTo(i * 8.5, 34);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 头
    const head = ctx.createLinearGradient(0, 412, 0, 750);
    head.addColorStop(0, '#5a8d49');
    head.addColorStop(.55, '#4A7C3F');
    head.addColorStop(1, '#38612f');
    ctx.fillStyle = head;
    headPath();
    ctx.fill();
    ctx.strokeStyle = '#1f351b';
    ctx.lineWidth = 5;
    ctx.stroke();

    // 头顶鳞片
    ctx.fillStyle = 'rgba(39, 65, 31, .23)';
    for (const s of [[143, 486, 13, 7, -.5], [309, 494, 11, 6, .5], [198, 429, 9, 5, -.2], [255, 430, 8, 4, .3]]) {
      ctx.beginPath();
      ctx.ellipse(s[0], s[1], s[2], s[3], s[4], 0, TAU);
      ctx.fill();
    }

    drawSnout(getMouthGeom());
    drawMouth();
    drawFireBreath();

    // 腮帮子
    const puff = 1 + (croc.chew > 0 ? Math.sin(clock * 35) * .075 * (croc.chew / .58) : 0) + (croc.happy > 0 ? .06 : 0);
    for (const side of [-1, 1]) {
      const cx = 225 + side * 111;
      ctx.fillStyle = 'rgba(96, 149, 77, .6)';
      ctx.beginPath();
      ctx.ellipse(cx, 632, 37 * puff, 30 * puff, side * .08, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(34, 55, 26, .34)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(131, 178, 106, .38)';
      ctx.beginPath();
      ctx.arc(cx, 632, 24, Math.PI * 1.16, Math.PI * 1.63);
      ctx.stroke();
    }

    drawSoot();

    // 两侧颊鳞
    ctx.fillStyle = 'rgba(37, 63, 29, .28)';
    for (const side of [-1, 1]) {
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(225 + side * (112 + (i % 2) * 10), 512 + i * 25, 12 - i, 5.5, side * .2, 0, TAU);
        ctx.fill();
      }
    }

    // 眼睛
    drawEye(167, 472, -1, mood);
    drawEye(283, 472, 1, mood);
    drawBrows(mood);

    // 眼神光
    if (G.frenzyActive) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const eg = ctx.createRadialGradient(225, 472, 5, 225, 472, 120);
      eg.addColorStop(0, 'rgba(255, 108, 77, .18)');
      eg.addColorStop(1, 'rgba(255, 108, 77, 0)');
      ctx.fillStyle = eg;
      ctx.fillRect(110, 377, 230, 200);
      ctx.restore();

      // Deal-with-it shades: pure meme, zero dignity.
      ctx.save();
      ctx.fillStyle = '#0B0F0C';
      ctx.strokeStyle = '#35432F';
      ctx.lineWidth = 3;
      for (const side of [-1, 1]) {
        const x = 225 + side * 58;
        ctx.beginPath();
        roundRectPath(x - 35, 453, 70, 38, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(249, 168, 212, .35)';
        ctx.beginPath();
        ctx.moveTo(x - 24, 482);
        ctx.lineTo(x - 2, 458);
        ctx.lineTo(x + 6, 458);
        ctx.lineTo(x - 16, 482);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#0B0F0C';
      }
      ctx.beginPath();
      ctx.moveTo(197, 464);
      ctx.lineTo(253, 464);
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#0B0F0C';
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(132, 458);
      ctx.lineTo(108, 450);
      ctx.moveTo(318, 458);
      ctx.lineTo(342, 450);
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();
    }

    // 少量高光，增加扁平层次
    ctx.strokeStyle = 'rgba(137, 181, 112, .36)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(111, 552);
    ctx.quadraticCurveTo(101, 590, 106, 615);
    ctx.moveTo(339, 552);
    ctx.quadraticCurveTo(349, 590, 344, 615);
    ctx.stroke();

    ctx.restore();

    // 生气蒸汽
    if (G.state === 'over' && G.overReveal < 1.2) {
      const a = clamp(1 - G.overReveal / 1.2, 0, 1);
      ctx.save();
      ctx.globalAlpha = a * .55;
      ctx.strokeStyle = '#E6F0DA';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      for (const side of [-1, 1]) {
        for (let i = 0; i < 3; i++) {
          const x = 225 + side * (115 + i * 17);
          const y = 400 - i * 6 + Math.sin(clock * 5 + i) * 4;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + side * 8, y - 10, x + side * 3, y - 20);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }

  /* ---------------------------------- 绘制投喂物 ---------------------------------- */
  function drawFoodToken(kind, x, y, scale) {
    const s = scale || 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.shadowColor = 'rgba(0,0,0,.35)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 3;

    if (kind === 'chili') {
      ctx.fillStyle = '#E23B2E';
      ctx.beginPath();
      ctx.moveTo(-2, -8);
      ctx.bezierCurveTo(10, -8, 11, 2, 5, 8);
      ctx.bezierCurveTo(1, 12, -8, 10, -9, 4);
      ctx.bezierCurveTo(-10, 0, -7, -5, -2, -8);
      ctx.closePath();
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#8C1D16';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.strokeStyle = '#4A7C3F';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-2, -8);
      ctx.quadraticCurveTo(-1, -13, 4, -14);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath();
      ctx.ellipse(-4, -2, 2.4, 4.2, .55, 0, TAU);
      ctx.fill();
    } else if (kind === 'gold') {
      ctx.shadowColor = 'rgba(255, 209, 102, .85)';
      ctx.shadowBlur = 16;
      const g = ctx.createLinearGradient(-10, -7, 10, 8);
      g.addColorStop(0, '#FFF3B0');
      g.addColorStop(.45, '#FFD166');
      g.addColorStop(1, '#D99A2B');
      roundRectPath(-10.5, -7, 21, 14, 5.6);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#8C5A12';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath();
      ctx.ellipse(-4, -3.4, 3.8, 2.1, -.4, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#FFF7D6';
      drawStarShape(6, -4, 3.2, .36, 4, clock * 2);
      ctx.fill();
    } else {
      roundRectPath(-9.4, -6.5, 18.8, 13, 5.2);
      ctx.fillStyle = '#F472B6';
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#A62C70';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.beginPath();
      ctx.ellipse(-3.6, -3.1, 3.4, 2.1, -.4, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMeats() {
    for (const m of meats) {
      const kind = m.kind || 'meat';
      const trailColor = kind === 'gold' ? '255, 209, 102' : kind === 'chili' ? '255, 106, 70' : '244, 114, 182';
      for (let i = 0; i < m.trail.length; i++) {
        const tr = m.trail[i];
        const a = (i + 1) / m.trail.length * .12;
        ctx.fillStyle = 'rgba(' + trailColor + ',' + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, 3 + i * .6, 0, TAU);
        ctx.fill();
      }
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(m.rot);
      drawFoodToken(kind, 0, 0, 1);
      ctx.restore();
    }
  }

  function drawOrder() {
    if (G.state !== 'playing' || !G.order) return;
    const o = G.order;
    const kind = o.kind;
    const p = clamp(o.timer / o.duration, 0, 1);
    const accent = kind === 'chili' ? '#FF8A5C' : '#F9A8D4';
    const x = 225;
    const y = 302 + Math.sin(clock * 3.1) * 2;
    const w = 218;
    const h = 66;
    ctx.save();
    roundRectPath(x - w / 2 + 2, y + 5, w, h, 14);
    ctx.fillStyle = 'rgba(4, 8, 6, .28)';
    ctx.fill();
    roundRectPath(x - w / 2, y, w, h, 14);
    ctx.fillStyle = 'rgba(12, 20, 15, .94)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(247, 214, 138, .55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 11, y + h - 1);
    ctx.lineTo(x, y + h + 15);
    ctx.lineTo(x + 11, y + h - 1);
    ctx.closePath();
    ctx.fillStyle = 'rgba(12, 20, 15, .94)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(247, 214, 138, .55)';
    ctx.stroke();

    drawFoodToken(kind, x - w / 2 + 29, y + 34, .82);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    setFont(8.5, 800);
    ctx.fillStyle = 'rgba(194, 211, 184, .62)';
    ctx.fillText('CROC WANTS', x - w / 2 + 52, y + 18);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#FFE2A6';
    ctx.fillText('BONUS +' + ((G.mod && G.mod.orderBonus) || 2), x + w / 2 - 13, y + 18);
    ctx.textAlign = 'left';
    setFont(20, 900);
    ctx.fillStyle = accent;
    ctx.fillText(kind === 'chili' ? 'SPICY. NOW.' : 'MEAT. NOW.', x - w / 2 + 52, y + 39);

    const barW = w - 26;
    roundRectPath(x - w / 2 + 13, y + h - 13, barW, 5, 2.5);
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    ctx.fill();
    if (p > 0) {
      roundRectPath(x - w / 2 + 13, y + h - 13, barW * p, 5, 2.5);
      ctx.fillStyle = p < .3 ? '#FF6B6B' : accent;
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBoss() {
    if (G.state !== 'playing' || !G.boss) return;
    const b = G.boss;
    const x = 84;
    const y = 198;
    const w = 282;
    const h = 92;
    const flash = b.flash > 0 ? .5 + .5 * Math.sin(clock * 30) : 1;
    ctx.save();
    roundRectPath(x + 2, y + 5, w, h, 16);
    ctx.fillStyle = 'rgba(4, 8, 6, .3)';
    ctx.fill();
    roundRectPath(x, y, w, h, 16);
    ctx.fillStyle = 'rgba(20, 22, 20, .95)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 138, 128, ' + (.52 + .18 * flash).toFixed(2) + ')';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // 检查板
    ctx.save();
    ctx.translate(x + 24, y + 22);
    ctx.rotate(-.08);
    roundRectPath(0, 0, 34, 48, 4);
    ctx.fillStyle = '#E9E3D2';
    ctx.fill();
    ctx.strokeStyle = 'rgba(40, 42, 36, .7)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#8C8A7E';
    roundRectPath(11, -5, 13, 9, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(57, 65, 53, .55)';
    ctx.lineWidth = 1.3;
    for (let i = 0; i < 4; i++) {

  function drawGoldPickup() {
    const g = G.goldPickup;
    if (!g) return;
    const fade = clamp(g.life / .4, 0, 1);
    const bob = Math.sin(clock * 4.2) * 7;
    const pulse = 1 + Math.sin(clock * 5.5) * .06;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(g.x, g.y + bob);
    ctx.scale(pulse, pulse);
    ctx.globalCompositeOperation = 'lighter';
    const aura = ctx.createRadialGradient(0, 0, 4, 0, 0, 42);
    aura.addColorStop(0, 'rgba(255, 209, 102, .38)');
    aura.addColorStop(1, 'rgba(255, 209, 102, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, 42, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    drawFoodToken('gold', 0, 0, 1.45);
    ctx.strokeStyle = 'rgba(255, 225, 140, .55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(0, 0, 27 + Math.sin(clock * 4) * 3, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    for (const r of rings) {
      const a = clamp(r.life / r.maxLife, 0, 1) * .55;
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = a;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      if (p.kind === 'star') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        drawStarShape(0, 0, p.size, .34, 4, 0);
        ctx.fillStyle = p.color;
        ctx.fill();
      } else if (p.kind === 'glow') {
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      } else {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        roundRectPath(-p.size / 2, -p.size * .34, p.size, p.size * .68, 1.8);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawFloaters() {
    for (const f of floaters) {
      const t = 1 - f.life / f.maxLife;
      const a = clamp(f.life / .18, 0, 1);
      const pop = 1 + Math.sin(Math.min(1, t * 2.4) * Math.PI) * .16;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(f.x + Math.sin(t * 7 + f.wobble) * 4, f.y);
      ctx.scale(pop, pop);
      setFont(f.size, 900);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(10, 14, 12, .65)';
      ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
  }

  /* ---------------------------------- HUD ---------------------------------- */
  function isMuteHovered() {
    return pointer.active && inRect(pointer, MUTE_RECT);
  }

  function isRestartHovered() {
    return pointer.active && G.state === 'over' && G.overReveal > .78 && inRect(pointer, RESTART_RECT);
  }

  function drawMuteIcon() {
    const hover = isMuteHovered();
    if (hover) {
      roundRectPath(MUTE_RECT.x + 4, MUTE_RECT.y + 3, MUTE_RECT.w - 8, MUTE_RECT.h - 6, 14);
      ctx.fillStyle = 'rgba(255,255,255,.055)';
      ctx.fill();
    }

    const cx = 407;
    const cy = 45;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = Sound.muted ? 'rgba(139,154,142,.62)' : 'rgba(219,233,211,.82)';
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 2.3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-12, -4);
    ctx.lineTo(-6, -4);
    ctx.lineTo(1, -11);
    ctx.lineTo(1, 11);
    ctx.lineTo(-6, 4);
    ctx.lineTo(-12, 4);
    ctx.closePath();
    ctx.fill();
    if (!Sound.muted) {
      ctx.beginPath();
      ctx.arc(3, 0, 8, -.72, .72);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(3, 0, 14, -.65, .65);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#D46A70';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(9, -8);
      ctx.lineTo(18, 8);
      ctx.moveTo(18, -8);
      ctx.lineTo(9, 8);
      ctx.stroke();
    }
    ctx.restore();

    if (G.mutedFlash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, G.mutedFlash);
      ctx.strokeStyle = Sound.muted ? 'rgba(212,106,112,.4)' : 'rgba(159,201,137,.38)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 22 + (1 - G.mutedFlash) * 9, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawFoodChips() {
    for (const kind of ['meat', 'chili']) {
      const r = FOOD_RECTS[kind];
      const selected = G.food === kind;
      const locked = kind === 'chili' && !G.chiliUnlocked;
      ctx.save();
      ctx.globalAlpha = locked ? .58 : 1;
      roundRectPath(r.x, r.y, r.w, r.h, 10);
      ctx.fillStyle = selected ? 'rgba(255, 228, 160, .14)' : 'rgba(20, 29, 24, .55)';

      ctx.strokeStyle = selected ? 'rgba(255, 218, 132, .9)' : 'rgba(151, 179, 139, .3)';
      ctx.lineWidth = selected ? 1.6 : 1;
      ctx.stroke();
      drawFoodToken(kind, r.x + 16, r.y + 19, .62);
      setFont(11, 900);

      ctx.textBaseline = 'middle';

      setFont(10, 800);
      ctx.fillStyle = '#FFD166';

      ctx.restore();

  }

  function drawHUD() {
    // 最高分
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    setFont(11, 700);
    ctx.fillStyle = 'rgba(197, 214, 193, .46)';
    ctx.fillText('BEST', 24, 25);
    setFont(17, 800);
    ctx.fillStyle = 'rgba(196, 215, 190, .8)';
    ctx.fillText(String(G.best), 24, 45);

    // 段位 / 本机排名
    if (G.state === 'playing') {
      const rk = rankFor(G.score);
      setFont(9.5, 800);
      ctx.fillStyle = rk.color;
      ctx.fillText(rk.name + ' · RUN #' + G.rank, 24, 66);
      drawFoodChips();
    }

    // 分数
    ctx.textAlign = 'center';
    setFont(10, 800);
    ctx.fillStyle = 'rgba(224, 239, 214, .4)';
    ctx.fillText('SCORE', 225, 24);

    const scoreScale = 1 + G.scorePop * .22;
    ctx.save();
    ctx.translate(225, 87);
    ctx.scale(scoreScale, scoreScale);
    setFont(67, 900);
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(8, 12, 10, .4)';
    ctx.strokeText(String(G.score), 0, 0);
    if (G.frenzyActive) {
      const sg = ctx.createLinearGradient(0, -55, 0, 8);
      sg.addColorStop(0, '#FFE3A1');
      sg.addColorStop(1, '#FF8A78');
      ctx.fillStyle = sg;
    } else {
      ctx.fillStyle = '#F2F6EB';
    }
    ctx.fillText(String(G.score), 0, 0);
    ctx.restore();

    // 生命
    for (let i = 0; i < 3; i++) {
      const filled = i < G.lives;
      let scale = 1;
      if (G.heartPulse > 0 && (i === G.lives || i === G.lives - 1)) {
        scale += Math.sin((1 - G.heartPulse) * Math.PI) * .2;
      }
      ctx.save();
      ctx.translate(313 + i * 35, 98);
      ctx.scale(scale, scale);
      drawHeart(0, 0, 11.8, filled);
      ctx.restore();
    }

    // 30 秒倒计时
    if (G.state === 'playing') {
      const left = Math.max(0, ROUND_TIME - G.elapsed);
      const secs = Math.ceil(left);
      const urgent = left <= 5;
      const pulse = urgent ? .72 + .28 * Math.sin(clock * 11) : 1;
      ctx.save();
      roundRectPath(312, 111, 76, 26, 9);
      ctx.fillStyle = urgent ? 'rgba(74, 20, 18, .72)' : 'rgba(12, 20, 18, .52)';
      ctx.fill();
      ctx.strokeStyle = urgent ? 'rgba(255, 112, 100, ' + (.38 + .3 * pulse).toFixed(2) + ')' : 'rgba(180, 205, 170, .18)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      setFont(8, 800);
      ctx.fillStyle = urgent ? 'rgba(255, 168, 158, ' + pulse.toFixed(2) + ')' : 'rgba(190, 210, 181, .55)';
      ctx.fillText('TIME', 350, 119);
      setFont(14, 900);
      ctx.fillStyle = urgent ? '#FF8A80' : '#DDE9D5';
      ctx.fillText('0:' + String(secs).padStart(2, '0'), 350, 132);
      ctx.restore();
    }

    drawMuteIcon();

    // 连击
    if (G.state === 'playing' && G.combo >= 2) {
      const s = 1 + Math.sin(clock * 8) * .035;
      ctx.save();
      ctx.translate(225, 128);
      ctx.scale(s, s);
      setFont(15, 900);
      ctx.textAlign = 'center';
      ctx.fillStyle = G.frenzyActive ? '#FFB6A6' : 'rgba(227, 191, 112, .9)';
      ctx.fillText('COMBO × ' + G.combo, 0, 0);
      ctx.restore();
    }

    // 五连击进度条：不用读数字也知道还差几口
    if (G.state === 'playing' && G.combo >= 1 && !G.frenzyActive) {
      const filled = Math.min(5, G.combo);
      ctx.save();
      for (let i = 0; i < 5; i++) {
        roundRectPath(166 + i * 25, 137, 18, 4.2, 2.1);
        ctx.fillStyle = i < filled ? 'rgba(244, 201, 107, .95)' : 'rgba(244, 246, 235, .14)';
        ctx.fill();
      }
      ctx.restore();
    }

    if (G.state === 'playing' && G.mod && !G.frenzyActive) {
      setFont(8.5, 800);
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(244, 201, 107, .58)';
      ctx.fillText('DAILY · ' + G.mod.name, 24, 150);
    }

    if (G.state === 'playing' && G.frenzyActive) {
      const a = .68 + .32 * Math.sin(clock * 10);
      ctx.save();
      ctx.globalAlpha = a;
      setFont(12, 900);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FF8C82';
      ctx.fillText('GIGACHAD MODE · DOUBLE POINTS', 225, 151);
      setFont(9.5, 800);
      ctx.fillStyle = '#FFD166';
      ctx.fillText('TAP TAP TAP · MOUTH IS STUCK OPEN', 225, 168);
      ctx.restore();
    }
  }

  function drawFrenzyEdges() {
    if (!G.frenzyActive) return;
    const a = .12 + .075 * (0.5 + 0.5 * Math.sin(clock * 9));
    const edge = 66;
    let grad = ctx.createLinearGradient(0, 0, edge, 0);
    grad.addColorStop(0, 'rgba(255, 44, 52,' + (a * 1.6).toFixed(3) + ')');
    grad.addColorStop(1, 'rgba(255, 44, 52,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, edge, H);
    grad = ctx.createLinearGradient(W, 0, W - edge, 0);
    grad.addColorStop(0, 'rgba(255, 44, 52,' + (a * 1.6).toFixed(3) + ')');
    grad.addColorStop(1, 'rgba(255, 44, 52,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(W - edge, 0, edge, H);
    grad = ctx.createLinearGradient(0, 0, 0, edge);
    grad.addColorStop(0, 'rgba(255, 44, 52,' + a.toFixed(3) + ')');
    grad.addColorStop(1, 'rgba(255, 44, 52,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, edge);
    grad = ctx.createLinearGradient(0, H, 0, H - edge);
    grad.addColorStop(0, 'rgba(255, 44, 52,' + a.toFixed(3) + ')');
    grad.addColorStop(1, 'rgba(255, 44, 52,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, H - edge, W, edge);
  }

  function drawGameOver() {
    if (G.overReveal <= .22) return;
    const p = clamp((G.overReveal - .22) / .46, 0, 1);
    const e = easeOutCubic(p);
    const hover = isRestartHovered();

    ctx.save();
    ctx.globalAlpha = e;
    ctx.fillStyle = 'rgba(5, 8, 9, .76)';
    ctx.fillRect(0, 0, W, H);

    const panelX = 45;
    const panelY = 160 + (1 - e) * 22;
    const panelW = 360;
    const panelH = 530;
    roundRectPath(panelX, panelY, panelW, panelH, 24);
    ctx.fillStyle = 'rgba(18, 24, 26, .93)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(160, 188, 149, .25)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    roundRectPath(panelX + 1, panelY + 1, panelW - 2, 80, 23);
    const topGlow = ctx.createLinearGradient(0, panelY, 0, panelY + 82);
    topGlow.addColorStop(0, 'rgba(126, 162, 113, .09)');
    topGlow.addColorStop(1, 'rgba(126, 162, 113, 0)');
    ctx.fillStyle = topGlow;
    ctx.fill();

    setFont(11, 800);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255, 142, 133, .72)';
    ctx.fillText(G.timeUp ? 'THE CLOCK BEAT YOU' : 'GAME OVER, BESTIE', 225, panelY + 34);

    setFont(34, 900);
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.strokeText(G.timeUp ? "TIME'S UP!" : 'CHOMPED!', 225, panelY + 76);
    ctx.fillStyle = '#FF8A80';
    ctx.fillText(G.timeUp ? "TIME'S UP!" : 'CHOMPED!', 225, panelY + 76);

    setFont(11, 800);
    ctx.fillStyle = 'rgba(189, 207, 181, .56)';
    ctx.fillText('YOUR SCORE', 225, panelY + 116);

    setFont(76, 900);
    const sg = ctx.createLinearGradient(0, panelY + 130, 0, panelY + 202);
    sg.addColorStop(0, '#F7FAF0');
    sg.addColorStop(1, '#CBDCC2');
    ctx.fillStyle = sg;
    ctx.fillText(String(G.score), 225, panelY + 191);

    setFont(13, 700);
    ctx.fillStyle = 'rgba(187, 206, 178, .65)';
    ctx.fillText('BEST  ' + G.best, 225, panelY + 226);
    if (G.newRecord) {
      setFont(12, 900);
      ctx.fillStyle = '#F4C96B';
      ctx.fillText('NEW RECORD!', 225, panelY + 248);
    }

    setFont(13.5, 600);
    ctx.fillStyle = 'rgba(210, 226, 201, .86)';
    ctx.fillText('“' + G.quip + '”', 225, panelY + 277);

    // 本机排名
    const rk = rankFor(G.score);
    setFont(11.5, 800);
    ctx.fillStyle = rk.color;
    ctx.fillText('RUN RANK #' + G.rank + ' / ' + G.board.length + ' · ' + rk.name, 225, panelY + 305);

    // 前三名
    const rows = G.board.slice(0, 3);
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const ry = panelY + 329 + i * 22;
      ctx.save();
      if (row.you) {
        roundRectPath(70, ry - 13, 310, 20, 7);
        ctx.fillStyle = 'rgba(255, 209, 102, .09)';
        ctx.fill();
      }
      setFont(11, row.you ? 900 : 700);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = row.you ? '#FFD166' : 'rgba(195, 212, 186, .72)';
      ctx.fillText((i + 1) + '  ' + row.name, 82, ry);
      ctx.textAlign = 'right';
      ctx.fillStyle = row.you ? '#FFE4A0' : 'rgba(195, 212, 186, .6)';
      ctx.fillText(String(row.score), 368, ry);
      ctx.restore();
    }

    // 按钮
    roundRectPath(RESTART_RECT.x, RESTART_RECT.y + (1 - e) * 10, RESTART_RECT.w, RESTART_RECT.h, 16);
    ctx.fillStyle = hover ? 'rgba(133, 178, 112, .14)' : 'rgba(255,255,255,.015)';
    ctx.fill();
    ctx.strokeStyle = hover ? 'rgba(201, 228, 181, .92)' : 'rgba(164, 198, 145, .6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    setFont(18, 800);
    ctx.fillStyle = '#E9F1E0';
    ctx.fillText('RUN IT BACK', 225, RESTART_RECT.y + 37 + (1 - e) * 10);

    setFont(10.5, 600);
    ctx.fillStyle = 'rgba(164, 184, 155, .45)';
    ctx.fillText('SPACE / CLICK THE BUTTON TO RUN IT BACK', 225, panelY + 512);

    ctx.restore();
  }

  /* ---------------------------------- 主绘制 ---------------------------------- */
  function draw() {
    const sx = viewW / W;
    const sy = viewH / H;
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    drawBackground();

    ctx.save();
    if (!REDUCED_MOTION && G.shakeTime > 0 && G.shakePower > 0) {
      const amp = G.shakePower * Math.pow(G.shakeTime / G.shakeDuration, 1.15);
      ctx.translate(rand(-amp, amp), rand(-amp, amp));
    }
    if (!REDUCED_MOTION && G.zoomPulse > 0) {
      const z = 1 + G.zoomPulse;
      ctx.translate(225, 520);
      ctx.scale(z, z);
      ctx.translate(-225, -520);
    }
    drawCroc();
    drawGoldPickup();
    drawMeats();
    drawParticles();
    drawFloaters();
    ctx.restore();

    drawOrder();
    drawBoss();
    drawVignette();
    drawFlash();
    drawWarmFlash();
    drawFrenzyEdges();
    drawHUD();
    drawPhaseBanner();

    if (G.state === 'ready') drawReadyUI();
    if (G.state === 'playing' && G.tutorial > 0) drawTutorial();
    if (G.state === 'over') drawGameOver();
    if (G.paused) drawPause();
  }

  /* ---------------------------------- 主循环 ---------------------------------- */
  function frame(now) {
    const raw = (now - lastFrame) / 1000;
    lastFrame = now;
    const dt = clamp(Number.isFinite(raw) ? raw : 0, 0, .05);
    if (!G.paused && !document.hidden) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------------------------------- 尺寸 / 暂停 / 调试 ---------------------------------- */
  function onResize() {
    fitCanvas();
    lastFrame = performance.now();
  }
  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize, { passive: true });
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => fitCanvas());
    ro.observe(stage);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (G.state === 'playing' && !G.paused) {
        G.paused = true;
        if (Sound.ctx && Sound.ctx.state === 'running') {
          Sound.ctx.suspend().catch(() => {});
        }
      }
    } else {
      lastFrame = performance.now();
    }
  });

  fitCanvas();
  onResize();
  requestAnimationFrame(frame);

  // 只在 ?debug=1 时开放，用于开发自动验收，不影响正常游玩。
  if (new URLSearchParams(location.search).has('debug')) {
    window.__CROC_DEBUG__ = {
      snapshot() {
        const r = canvas.getBoundingClientRect();
        return {
          state: G.state,
          paused: G.paused,
          score: G.score,
          best: G.best,
          lives: G.lives,
          combo: G.combo,
          maxCombo: G.maxCombo,
          frenzy: G.frenzyActive,
          frenzyTime: +G.frenzyTime.toFixed(2),
          elapsed: +G.elapsed.toFixed(2),
          roundTime: ROUND_TIME,
          timeLeft: +Math.max(0, ROUND_TIME - G.elapsed).toFixed(2),
          timeUp: G.timeUp,
          mouth: {
            mode: mouth.mode,
            fake: mouth.fake,
            gape: +mouth.gape.toFixed(3),
            timer: +mouth.timer.toFixed(3),
            isOpen: mouthIsOpen()
          },
          meats: meats.length,
          overReveal: +G.overReveal.toFixed(2),
          newRecord: G.newRecord,
          quip: G.quip,
          muted: Sound.muted,
          audio: Sound.ctx ? Sound.ctx.state : 'none',
          music: Sound.musicPlaying,
          musicStep: Sound.musicStep,
          food: G.food,
          chiliUnlocked: G.chiliUnlocked,
          goldShots: G.goldShots,
          goldPickup: G.goldPickup ? { x: +G.goldPickup.x.toFixed(1), y: +G.goldPickup.y.toFixed(1), life: +G.goldPickup.life.toFixed(2) } : null,
          order: G.order ? { kind: G.order.kind, timer: +G.order.timer.toFixed(2), duration: +G.order.duration.toFixed(2) } : null,
          orderTimer: +G.orderTimer.toFixed(2),
          mod: G.mod ? { id: G.mod.id, name: G.mod.name } : null,
          boss: G.boss ? { timer: +G.boss.timer.toFixed(2), hits: G.boss.hits, need: G.boss.need } : null,
          bossNext: +G.bossNext.toFixed(1),
          phase: G.phase,
          phaseBanner: +G.phaseBanner.toFixed(2),
          rank: G.rank,
          rankTitle: G.rankTitle,
          board: G.board.slice(0, 5),
          croc: { fire: +croc.fire.toFixed(2), burnt: +croc.burnt.toFixed(2), shock: +croc.shock.toFixed(2), dizzy: +croc.dizzy.toFixed(2), smug: +croc.smug.toFixed(2) },
          canvas: { cssW: +r.width.toFixed(2), cssH: +r.height.toFixed(2), pxW: canvas.width, pxH: canvas.height, dpr: window.devicePixelRatio || 1 }
        };
      },
      start() {
        if (G.state === 'ready') startGame();
      },
      restart() {
        if (G.state === 'over') restartGame();
      },
      setMouth(mode) {
        mouth.doubleNext = false;
        if (mode === 'open') {
          mouth.mode = 'open';
          mouth.fake = false;
          mouth.gape = 1;
          mouth.target = 1;
          mouth.timer = 999;
        } else if (mode === 'closed') {
          mouth.mode = 'closed';
          mouth.fake = false;
          mouth.gape = 0;
          mouth.target = 0;
          mouth.timer = 999;
        } else if (mode === 'fake') {
          mouth.mode = 'open';
          mouth.fake = true;
          mouth.gape = .44;
          mouth.target = .44;
          mouth.timer = 999;
        }
      },
      throwAt(x, y) {
        if (G.state !== 'playing') return false;
        G.lastThrow = -99;
        throwMeat(x === undefined ? 225 : x, y === undefined ? 390 : y);
        return true;
      },
      setElapsed(seconds) {
        G.elapsed = Math.max(0, Number(seconds) || 0);
      },
      setLives(n) {
        G.lives = clamp(Math.floor(Number(n) || 0), 0, 3);
      },
      setScore(n) {
        G.score = Math.max(0, Number(n) || 0);
      },
      setFood(kind) {
        selectFood(kind === 'chili' ? 'chili' : 'meat');
      },
      unlockChili() {
        G.chiliUnlocked = true;
      },
      spawnGold() {
        spawnGold();
      },
      collectGold() {
        collectGold();
      },
      setPhase(n) {
        enterPhase(clamp(Math.floor(Number(n) || 0), 0, 3));
      },
      forceOrder(kind, sike) {
        G.order = null;
        G.orderTimer = 0;
        spawnOrder();
        if (G.order && (kind === 'meat' || kind === 'chili')) G.order.kind = kind;
        if (G.order && sike) {
          G.order.flipPending = true;
          G.order.flipped = false;
          G.order.age = 0;
        }
      },
      forceBoss() {
        G.boss = null;
        G.bossNext = 0;
        startBoss();
      },
      setBossTimer(sec) {
        if (G.boss) G.boss.timer = Math.max(0, Number(sec) || 0);
      },
      setModifier(id) {
        const m = DAILY_MODS.find(v => v.id === id);
        if (!m) return;
        G.mod = m;
        if (m.spicy) G.chiliUnlocked = true;
        if (m.goldFast) G.goldTimer = Math.min(G.goldTimer, 4);
      },
      setMood(m) {
        if (!m) return;
        for (const k of ['fire', 'burnt', 'shock', 'dizzy', 'smug']) {
          if (typeof m[k] === 'number') croc[k] = m[k];
        }
      },
      toggleMute() {
        Sound.init();
        Sound.toggle();
      }
    };
  }
})();
</script>
</body>
</html>
